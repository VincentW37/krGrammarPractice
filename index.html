<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>Korean Grammar Master · 韓語文法互動學習</title>
  <style>
    :root {
      --primary: #58cc02; /* Duolingo vibrant green */
      --primary-dark: #46a302;
      --primary-shadow: #46a302;
      --indigo: #4f46e5;
      --indigo-shadow: #3730a3;
      --indigo-light: #eef2ff;
      --secondary: #1cb0f6;
      --secondary-shadow: #1899d6;
      --accent: #ff9600;
      --accent-shadow: #d88000;
      --danger: #ff4b4b;
      --danger-shadow: #ea2b2b;
      --danger-light: #fee2e2;
      --success-light: #dcfce7;
      --card-bg: #ffffff;
      --bg: #f7f9fa;
      --text: #3c3c3c;
      --text-muted: #777777;
      --border: #e5e5e5;
      --border-dark: #d4d4d4;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-pill: 999px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 60px);
      padding-bottom: calc(var(--safe-bottom) + 75px);
      overflow-x: hidden;
    }

    /* Top App Header (Duolingo / iOS style) */
    header.app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--safe-top) + 60px);
      padding-top: var(--safe-top);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
      z-index: 100;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: #f1f5f9;
      color: var(--text);
    }

    .stat-pill.streak { color: var(--accent); }
    .stat-pill.xp { color: #8b5cf6; }
    .stat-pill.hearts { color: var(--danger); }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.15s;
    }

    .icon-btn:active {
      background: #e2e8f0;
      transform: scale(0.92);
    }

    /* Progress Capsule Header Bar */
    .session-progress-bar {
      position: fixed;
      top: calc(var(--safe-top) + 60px);
      left: 0;
      right: 0;
      height: 12px;
      background: #e5e7eb;
      z-index: 95;
      padding: 2px 16px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #58cc02, #22c55e);
      border-radius: 6px;
      transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 6px;
      right: 6px;
      height: 3px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 3px;
    }

    /* Main Container */
    main.app-main {
      flex: 1;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Horizontal Chip Filter Bar */
    .chip-scroll-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .chip-scroll-container::-webkit-scrollbar { display: none; }

    .chip-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--border);
      background: white;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 0 var(--border);
      transition: all 0.15s ease;
    }

    .chip-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 transparent;
    }

    .chip-btn.active {
      border-color: var(--secondary);
      background: #f0f9ff;
      color: var(--secondary);
      box-shadow: 0 2px 0 var(--secondary-shadow);
    }

    /* Question Screen Layout */
    .question-screen {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .unit-tag-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .level-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .badge-beg { background: #e0f2fe; color: #0369a1; }
    .badge-mid { background: #dcfce7; color: #15803d; }
    .badge-adv { background: #fce7f3; color: #9d174d; }

    .unit-title-text {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    /* Prompt Box */
    .prompt-bubble {
      background: white;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 4px 0 var(--border);
      margin-bottom: 20px;
      position: relative;
    }

    .prompt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .prompt-label {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--indigo);
      text-transform: uppercase;
    }

    .speaker-btn {
      background: var(--indigo-light);
      border: none;
      color: var(--indigo);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .speaker-btn:active {
      transform: scale(0.95);
      background: #e0e7ff;
    }

    .question-dialogue {
      font-size: 1.18rem;
      font-weight: 600;
      line-height: 1.75;
      color: #1e293b;
      white-space: pre-line;
      user-select: text;
    }

    .blank-placeholder {
      display: inline-block;
      min-width: 70px;
      border-bottom: 3px dashed var(--indigo);
      color: var(--indigo);
      text-align: center;
      padding: 0 4px;
      font-weight: 800;
    }

    /* Duolingo Chunky 3D Option Buttons */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .chunky-option {
      width: 100%;
      min-height: 58px;
      padding: 14px 16px;
      background: white;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 0 var(--border-dark);
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .chunky-option:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border-dark);
    }

    .option-key {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .chunky-option.selected {
      border-color: #6366f1;
      background: var(--indigo-light);
      box-shadow: 0 4px 0 #4f46e5;
    }
    .chunky-option.selected .option-key {
      border-color: #6366f1;
      background: #6366f1;
      color: white;
    }

    .chunky-option.correct-reveal {
      border-color: #22c55e !important;
      background: #f0fdf4 !important;
      box-shadow: 0 4px 0 #16a34a !important;
      color: #15803d !important;
    }
    .chunky-option.correct-reveal .option-key {
      border-color: #16a34a;
      background: #16a34a;
      color: white;
    }

    .chunky-option.wrong-reveal {
      border-color: #ef4444 !important;
      background: #fef2f2 !important;
      box-shadow: 0 4px 0 #dc2626 !important;
      color: #b91c1c !important;
    }
    .chunky-option.wrong-reveal .option-key {
      border-color: #dc2626;
      background: #dc2626;
      color: white;
    }

    /* Duolingo Slide-Up Bottom Drawer */
    .feedback-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(var(--safe-bottom) + 20px);
      box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
      transform: translateY(110%);
      transition: transform 0.32s cubic-bezier(0.18, 0.89, 0.32, 1.18);
      z-index: 200;
      max-width: 600px;
      margin: 0 auto;
    }

    .feedback-sheet.open {
      transform: translateY(0);
    }

    .feedback-sheet.correct {
      background: var(--success-light);
      border-top: 2px solid #86efac;
    }

    .feedback-sheet.wrong {
      background: var(--danger-light);
      border-top: 2px solid #fca5a5;
    }

    .feedback-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .feedback-icon {
      font-size: 1.8rem;
    }

    .feedback-title {
      font-size: 1.3rem;
      font-weight: 800;
    }
    .feedback-sheet.correct .feedback-title { color: #15803d; }
    .feedback-sheet.wrong .feedback-title { color: #b91c1c; }

    .feedback-correct-answer {
      font-size: 1rem;
      font-weight: 700;
      color: #15803d;
      margin-bottom: 8px;
    }

    .feedback-explanation {
      font-size: 0.92rem;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 14px;
      max-height: 150px;
      overflow-y: auto;
    }

    .btn-continue {
      width: 100%;
      height: 54px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 1.1rem;
      font-weight: 800;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.1s;
    }

    .feedback-sheet.correct .btn-continue {
      background: var(--primary);
      box-shadow: 0 4px 0 var(--primary-shadow);
    }
    .feedback-sheet.correct .btn-continue:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--primary-shadow);
    }

    .feedback-sheet.wrong .btn-continue {
      background: var(--danger);
      box-shadow: 0 4px 0 var(--danger-shadow);
    }
    .feedback-sheet.wrong .btn-continue:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--danger-shadow);
    }

    /* iOS Native Fixed Bottom Tab Bar */
    nav.tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--safe-bottom) + 60px);
      padding-bottom: var(--safe-bottom);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 0;
      transition: color 0.15s;
    }

    .tab-item .tab-icon {
      font-size: 1.35rem;
    }

    .tab-item.active {
      color: #4f46e5;
    }

    /* Cheatsheet / Reference Screen on Mobile */
    .reference-screen {
      display: none;
    }

    .ref-search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border);
      background: white;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 16px;
      box-shadow: 0 2px 0 var(--border);
    }
    .ref-search-input:focus {
      border-color: var(--indigo);
    }

    .ref-card-mobile {
      background: white;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 0 var(--border);
    }

    .ref-card-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--indigo);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mobile-table-scroll {
      width: 100%;
      overflow-x: auto;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table.mobile-table {
      width: 100%;
      min-width: 320px;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    table.mobile-table th, table.mobile-table td {
      padding: 8px 10px;
      border: 1px solid var(--border);
      text-align: left;
    }
    table.mobile-table th { background: #f8fafc; font-weight: 700; }

    /* Mistakes Screen */
    .mistakes-screen {
      display: none;
    }

    /* Stats Screen */
    .stats-screen {
      display: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card-big {
      background: white;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      box-shadow: 0 3px 0 var(--border);
    }

    .stat-card-big .num {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--indigo);
      margin-bottom: 4px;
    }

    .stat-card-big .label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Top Fixed Header -->
  <header class="app-header">
    <div class="header-stats">
      <div class="stat-pill streak">🔥 <span id="streak-count">0</span></div>
      <div class="stat-pill xp">💎 <span id="xp-count">0</span></div>
      <div class="stat-pill hearts">❤️ <span id="hearts-count">5</span></div>
    </div>
    <div class="header-controls">
      <button class="icon-btn" onclick="shuffleCurrentQuestions(true)" title="隨機換題/洗牌">🔀</button>
      <button class="icon-btn" id="sound-toggle-btn" onclick="toggleSound()" title="音效切換">🔊</button>
      <button class="icon-btn" onclick="openChapterModal()" title="章節篩選">☰</button>
    </div>
  </header>

  <!-- Session Progress Bar -->
  <div class="session-progress-bar">
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
  </div>

  <main class="app-main">
    <!-- View 1: Practice Arena -->
    <section id="screen-practice" class="question-screen">
      <!-- Horizontal Chip Filters -->
      
      <!-- Horizontal Chip Filters (Book Level) -->
      <div class="chip-scroll-container">
        <button class="chip-btn active" onclick="setBookFilter('all', this)">🌟 全部 (600題)</button>
        <button class="chip-btn" onclick="setBookFilter('beginner', this)">📘 初級 (200題)</button>
        <button class="chip-btn" onclick="setBookFilter('intermediate', this)">📗 中級 (200題)</button>
        <button class="chip-btn" onclick="setBookFilter('advanced', this)">📕 高級 (200題)</button>
      </div>

      <!-- Secondary Chip Filters (Question Type) -->
      <div class="chip-scroll-container" style="padding-bottom: 8px; margin-top: -6px;">
        <button class="chip-btn active" style="font-size:0.78rem; padding: 5px 11px;" onclick="setTypeFilter('all', this)">🎯 全部題型</button>
        <button class="chip-btn" style="font-size:0.78rem; padding: 5px 11px;" onclick="setTypeFilter('mcq', this)">📝 對話選擇</button>
        <button class="chip-btn" style="font-size:0.78rem; padding: 5px 11px;" onclick="setTypeFilter('find_error', this)">🔍 語法改錯</button>
        <button class="chip-btn" style="font-size:0.78rem; padding: 5px 11px;" onclick="setTypeFilter('conjugation', this)">✍️ 詞形變換</button>
      </div>


      <!-- Question Card Body -->
      <div id="quiz-arena">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- View 2: Cheatsheet / Reference -->
    
    <!-- View 2: Cheatsheet / Reference (73 Chapters) -->
    <section id="screen-reference" class="reference-screen">
      <!-- 73 Chapters Level Filter Chips -->
      <div class="chip-scroll-container" style="margin-bottom:12px;">
        <button class="chip-btn active" onclick="setRefBookFilter('all', this)">🌟 全部 (73課)</button>
        <button class="chip-btn" onclick="setRefBookFilter('beginner', this)">📘 初級 (25課)</button>
        <button class="chip-btn" onclick="setRefBookFilter('intermediate', this)">📗 中級 (26章)</button>
        <button class="chip-btn" onclick="setRefBookFilter('advanced', this)">📕 高級 (22章)</button>
      </div>

      <input type="text" class="ref-search-input" id="ref-search" placeholder="🔍 搜尋 73 課文法速查（如：이유, 통에, 텐데, 12장, 반말）" oninput="filterReferences()">
      <div id="ref-list-container">
        <!-- Rendered dynamically -->
      </div>
    </section>


    <!-- View 3: Mistakes Screen -->
    <section id="screen-mistakes" class="mistakes-screen">
      <div id="mistakes-list-container">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- View 4: Stats Screen -->
    <section id="screen-stats" class="stats-screen">
      <div class="stats-grid">
        <div class="stat-card-big">
          <div class="num" id="stat-total-score">0</div>
          <div class="label">累計經驗 (XP)</div>
        </div>
        <div class="stat-card-big">
          <div class="num" id="stat-max-streak">0</div>
          <div class="label">最高連勝 (Streak)</div>
        </div>
        <div class="stat-card-big">
          <div class="num" id="stat-answered">0</div>
          <div class="label">已做題數</div>
        </div>
        <div class="stat-card-big">
          <div class="num" id="stat-accuracy">0%</div>
          <div class="label">總體正確率</div>
        </div>
      </div>

      <div class="prompt-bubble" style="text-align:center;">
        <h4 style="margin-bottom:8px;">💡 iPhone 溫習技巧</h4>
        <p style="font-size:0.9rem; color:var(--text-muted); line-height:1.6;">
          您可以點擊 Safari 底部的「分享 (Share)」按鈕，然後選擇<strong>「加入主畫面 (Add to Home Screen)」</strong>，即可像原生 App 一樣以全螢幕體驗溫習韓文！
        </p>
        <button class="btn-continue" style="background:#64748b; margin-top:14px; height:44px; font-size:0.92rem;" onclick="resetAllStats()">🔄 重置所有進度與記錄</button>
      </div>
    </section>
  </main>

  <!-- Duolingo Slide-up Bottom Drawer -->
  <div class="feedback-sheet" id="feedback-drawer">
    <div class="feedback-header-row">
      <div class="feedback-icon" id="fb-icon">✅</div>
      <div class="feedback-title" id="fb-title">대단해요! (做得好！)</div>
    </div>
    <div class="feedback-correct-answer" id="fb-answer"></div>
    <div class="feedback-explanation" id="fb-expl"></div>
    <button class="btn-continue" id="fb-continue-btn" onclick="nextQuestion()">繼續 (Continue) ➔</button>
  </div>

  <!-- iOS Fixed Bottom Navigation Tab Bar -->
  
  <!-- iOS Fixed Bottom Navigation Tab Bar -->
  <nav class="tab-bar">
    <button class="tab-item active" onclick="switchMobileTab('practice', this)">
      <span class="tab-icon">🎯</span>
      <span>練習 (600題)</span>
    </button>
    <button class="tab-item" onclick="switchMobileTab('reference', this)">
      <span class="tab-icon">📖</span>
      <span>73課速查</span>
    </button>
    <button class="tab-item" onclick="switchMobileTab('mistakes', this)">
      <span class="tab-icon">📌</span>

    const GRAMMAR_REFERENCES = [{"id": "ref_beg_01", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · 入門", "title": "Getting Ready · 韓語基礎準備 (이다/아니다, 있다/없다, 數詞與時間)", "lessons": ["01 이다/아니다", "02 있다/없다", "03 數字與量詞", "04 日期與星期", "05 時間表達"], "summary": "韓語發音後的第一道門檻，涵蓋最基礎的名詞謂語、存在方位、數詞量詞及時間日期表達。", "table": {"headers": ["項目", "主要形態", "核心規則與注意事項"], "rows": [["이다 / 아니다", "예요/이에요 / 이/가 아니에요", "名詞有收音接 이에요 / 이 아니에요；無收音接 예요 / 가 아니에요"], ["있다 / 없다", "N에 있다/없다, N이/가 있다/없다", "表示存在位置（在某處）或擁有（有/沒有某物）"], ["數字與量詞", "固有詞 vs 漢字詞", "量詞前 하나, 둘, 셋, 넷, 스물 縮為 한, 두, 세, 네, 스무"], ["時間日期", "時(固有詞) + 分(漢字詞)", "6月(유월)與10月(시월)發音規則脫落；小時固有詞，分鐘漢字詞"]]}, "examples": ["저는 학생이에요. (我是學生)", "방 안에 컴퓨터가 있어요. (房間裡有電腦)", "사과 두 개하고 커피 세 잔 주세요. (請給我兩個蘋果和三杯咖啡)"], "nuance": "疑問詞（누구, 무엇, 어디）做主語時必須接 이/가（누가, 무엇이, 어디가）。小時用固有詞，分鐘用漢字詞。"}, {"id": "ref_beg_02", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 1", "title": "Unit 1. Tenses · 時態 (現在式 / 過去式 / 未來式 / 進行式 / 過去完成式)", "lessons": ["01 現在式 -(스)ㅂ니다", "02 現在式 -아/어요", "03 過去式 -았/었어요", "04 未來式 -(으)ㄹ 거예요", "05 進行式 -고 있다", "06 過去完成式 -았/었었어요"], "summary": "韓語動詞與形容詞的五大基礎時態體系，掌握詞幹陽性/陰性母音結合與縮合規則。", "table": {"headers": ["時態", "結合形態", "核心語義與用法特點"], "rows": [["現在式", "ㅏ, ㅗ → -아요 / 其他 → -어요 / 하다 → 해요", "日常非格式體敬語，句尾語調升降區分陳述與疑問"], ["過去式", "詞幹 + -았/었어요", "過去某一時間點發生的動作或狀態"], ["過去完成式", "詞幹 + -았/었었어요", "過去曾如此，但該狀態目前已中斷改變（與現在斷絕）"], ["未來式", "詞幹 + -(으)ㄹ 거예요", "未來的計畫、打算或說話者的意志"], ["進行式", "動詞詞幹 + -고 있다", "動作正在持續進行中（英文 -ing）"]]}, "examples": ["지금 한국어를 공부해요. (現在在學韓語)", "작년에는 담배를 피웠었어요. 지금은 끊었어요. (去年曾抽過煙，現在戒了)", "주말에 영화를 볼 거예요. (週末打算看電影)"], "nuance": "-았/었어요 與 -았/었었어요 的區別：前者單純陳述過去事實，該狀態現在可能仍持續；後者明確表示過去狀態已結束並與現在對立斷絕。"}, {"id": "ref_beg_03", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 2", "title": "Unit 2. Negative Expressions · 否定表達 (詞彙否定 / 안 否定 / 못 否定)", "lessons": ["01 Word Negation", "02 안 / -지 않아요", "03 못 / -지 못해요"], "summary": "韓語否定的兩大層次：詞彙內在否定與句法否定（主觀不想 vs 客觀能力受阻）。", "table": {"headers": ["否定類別", "語法形式", "核心區別與限制"], "rows": [["詞彙否定", "이다→아니다, 있다→없다, 알다→모르다", "固有的對應反義單詞否定"], ["主觀否定 (안)", "안 A/V-아/어요, A/V-지 않아요", "主觀意志不想做某事；形容詞否定只能用 안"], ["能力/客觀否定 (못)", "못 V-아/어요, V-지 못해요", "缺乏能力或因外部客觀環境限制而無法做；【嚴禁接形容詞】"]]}, "examples": ["저는 매운 음식을 안 먹어요. (我自己不想吃辣)", "다리를 다쳐서 운동을 못해요. (因腳受傷無法運動)", "방이 넓지 않아요. (房間不寬敞，不可說 못 넓어요)"], "nuance": "形容詞絕對不可與 '못' 結合（❌못 예뻐요 → ⭕안 예뻐요 / 예쁘지 않아요）。名詞+하다 動詞否定時，안/못 置於 하다 前（공부를 안 해요）。"}, {"id": "ref_beg_04", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 3", "title": "Unit 3. Particles · 助詞大系 (主格/主題/受格/處所/限定/比較等 20 種核心助詞)", "lessons": ["01 이/가", "02 은/는", "03 을/를", "04 와/과, (이)랑, 하고", "05 의", "06 에(處所/方向)", "07 에(時間)", "08 에서", "09 부터/까지", "10 에게/한테/께", "11 도", "12 만", "13 밖에", "14 (으)로", "15 (이)나①", "16 (이)나②", "17 쯤", "18 처럼/같이", "19 보다", "20 마다"], "summary": "韓語語法的靈魂骨架，決定句子成分角色、話題焦點、範圍、工具手段及心理情態。", "table": {"headers": ["焦點對比組", "語法助詞", "核心區別與考點"], "rows": [["主語焦點 vs 話題對比", "이/가 vs 은/는", "이/가 焦點在主語是誰；은/는 焦點在後續述語，表已知主題與對比"], ["靜態存在 vs 動態行為", "에 vs 에서", "에 接存在詞(있다/없다)與到達點(가다)；에서 接行動動作(공부하다/먹다)"], ["限定肯定 vs 限定否定", "만 vs 밖에", "만 後接肯定句；밖에 後【必須接否定句】且嚴禁接命令句！"], ["手段方向", "-(으)로", "無收音或ㄹ收音接 로，其他收音接 으로；表工具、原料、方向、資格"]]}, "examples": ["누가 민우 씨예요? - 제가 민우예요. (主格焦點)", "사과가 한 개밖에 안 남았어요. (只剩一個蘋果，後接否定)", "가위로 종이를 잘라요. (用剪刀剪紙)"], "nuance": "時間名詞中 어제, 오늘, 내일, 언제 後面絕對不能加 '에'（❌어제에 → ⭕어제）。"}, {"id": "ref_beg_05", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 4", "title": "Unit 4. Listing and Contrast · 羅列與對比 (-고, -거나, -지만, -(으)ㄴ/는데①)", "lessons": ["01 A/V-고", "02 V-거나", "03 A/V-지만", "04 A/V-(으)ㄴ/는데①"], "summary": "連接句子表達並列、選擇或相反轉折的四大初級連接詞尾。", "table": {"headers": ["詞尾", "語法功能", "結合方式與語意特點"], "rows": [["-고", "並列與先後順序", "動詞/形容詞詞幹直接接 -고，不分收音"], ["-거나", "二擇一（或者）", "動詞詞幹接 -거나；名詞用 (이)나"], ["-지만", "但是、轉折", "前後兩句相反對立；前後主語可不同"], ["-(으)ㄴ/는데", "提示背景情境或轉折", "動詞接 -는데；形容詞有收音 -은데，無收音 -ㄴ데"]]}, "examples": ["바람이 불고 추워요. (颳風而且寒冷)", "김치는 맵지만 맛있어요. (泡菜雖然辣但很好吃)", "비가 오는데 우산을 쓰세요. (下雨了，請撐傘)"], "nuance": "-지만 單純陳述轉折事實；-(으)ㄴ/는데 則為後句提供前置背景或引導下文。"}, {"id": "ref_beg_06", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 5", "title": "Unit 5. Time Expressions · 時間關係詞尾 (前後順序、同時、期間、經過時間)", "lessons": ["01 -기 전에", "02 -(으)ㄴ 후에", "03 -고 나서", "04 -아/어서", "05 -(으)ㄹ 때", "06 -(으)면서", "07 -는 중", "08 -자마자", "09 -는 동안", "10 -(으)ㄴ 지"], "summary": "精確表達動作的前後順序、同時進行、進行中狀態及歷時經過。", "table": {"headers": ["詞尾", "時間關係", "核心限制與規則"], "rows": [["-기 전에", "在...之前", "動詞直接接 -기 전에；名詞接 N 전에"], ["-(으)ㄴ 후에", "在...之後", "動詞過去冠形詞加 후에；徹底完成用 -고 나서"], ["-(으)면서", "一邊...一邊", "前後兩動作同時進行；前後主語必須同一人"], ["-자마자", "一...立刻就...", "前動作剛結束後動作緊接著發生"], ["-(으)ㄴ 지", "自從...多久", "後常接 시간 + 되다 / 지나다 / 넘다"]]}, "examples": ["식사하기 전에 손을 씻어요. (吃飯前洗手)", "음악을 들으면서 운전해요. (邊聽音樂邊開車)", "한국에 온 지 1년이 되었어요. (來韓國已經一年了)"], "nuance": "-아/어서 表時間順序時，前後兩動作關係極其緊密（如 가서 만나다 去到並見面），且前句不可加過去式。"}, {"id": "ref_beg_07", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 6", "title": "Unit 6. Ability and Possibility · 能力與可能性 (-(으)ㄹ 수 있다/없다, -(으)ㄹ 줄 알다/모르다)", "lessons": ["01 V-(으)ㄹ 수 있다/없다", "02 V-(으)ㄹ 줄 알다/모르다"], "summary": "表達說話者或主語是否具備某種能力，或客觀情境下是否具備可能性。", "table": {"headers": ["表達法", "核心意義", "兩者用法區分"], "rows": [["-(으)ㄹ 수 있다/없다", "能力有或無、客觀情境可能/不可能", "通用於自身能力及客觀環境允許與否"], ["-(으)ㄹ 줄 알다/모르다", "是否懂得/掌握某項技術或方法", "專指透過學習而懂得或不懂得該做法（如開車、游泳）"]]}, "examples": ["한국어를 읽을 수 있어요. (能讀懂韓語)", "수영을 배운 적이 없어서 수영할 줄 몰라요. (沒學過游泳，不懂得怎麼游)"], "nuance": "ㄹ 收音動詞直接接 '-수 있다' (만들다 → 만들 수 있다)。"}, {"id": "ref_beg_08", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 7", "title": "Unit 7. Demands & Obligations · 要求義務、許可與禁止 (-(으)세요, -아/어야 하다, -아/어도 되다, -(으)면 안 되다)", "lessons": ["01 V-(으)세요", "02 V-지 마세요", "03 A/V-아/어야 되다/하다", "04 A/V-아/어도 되다", "05 A/V-(으)면 안 되다", "06 A/V-지 않아도 되다"], "summary": "社交與生活規則核心：命令請求、必須義務、准許與嚴禁不准。", "table": {"headers": ["語用功能", "文法形式", "語氣與使用限制"], "rows": [["禮貌請求/命令", "V-(으)세요 (否定: -지 마세요)", "非格式體最常用禮貌請求；格式體用 -(으)십시오"], ["必須義務", "A/V-아/어야 하다/되다", "表達客觀或道德上的必要義務（必須做）"], ["准許許可", "A/V-아/어도 되다", "表示被允許做某事（可以做）"], ["禁止不准", "A/V-(으)면 안 되다", "表示不被允許、違規禁止（不可以做）"], ["毋須不必", "A/V-지 않아도 되다", "表示沒有強制義務（不做也行）"]]}, "examples": ["창문을 열어 주세요. (請開窗)", "도서관에서는 떠들면 안 돼요. (在圖書館不可喧嘩)", "내일은 학교에 가지 않아도 돼요. (明天不必上學)"], "nuance": "-아/어야 하다 的口語常用型為 -아/어야 되다。"}, {"id": "ref_beg_09", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 8", "title": "Unit 8. Expressions of Hope · 願望與希望 (-고 싶다, -았/었으면 좋겠다)", "lessons": ["01 V-고 싶다", "02 A/V-았/었으면 좋겠다"], "summary": "表達說話者個人願望、轉述他人渴望，或對理想狀態的期盼。", "table": {"headers": ["文法", "人稱限制", "核心語意"], "rows": [["-고 싶다", "1、2人稱 (저는 ~고 싶어요)", "表達說話者自己或詢問對方的願望"], ["-고 싶어하다", "3人稱 (동생은 ~고 싶어해요)", "轉述第三者的願望需求，需轉為感情動詞化"], ["-았/었으면 좋겠다", "無人稱限制", "假定過去完成，期盼未來能呈現理想的好結果"]]}, "examples": ["한국에 여행 가고 싶어요. (我想去韓國旅行)", "동생은 피아노를 배우고 싶어해요. (妹妹想學鋼琴)", "내일 날씨가 맑았으면 좋겠어요. (希望明天天氣晴朗)"], "nuance": "第3人稱主語時絕對不能直接用 -고 싶다，必須用 -고 싶어하다！"}, {"id": "ref_beg_10", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 9", "title": "Unit 9. Reasons and Causes · 初級原因與理由 (-아/어서, -(으)니까, N 때문에)", "lessons": ["01 A/V-아/어서②", "02 A/V-(으)니까①", "03 N 때문에, A/V-기 때문에"], "summary": "初級最關鍵的原因三劍客，依據主客觀因果、後句語氣與時態進行嚴格區分。", "table": {"headers": ["文法", "後句能否接命令/共動", "前句能否加過去式 -았/었-"], "rows": [["-아/어서", "❌ 嚴禁接命令句 (-으세요) 與共動句 (-ㅂ시다)", "❌ 嚴禁加過去式（❌추웠어서）"], ["-(으)니까", "✅ 完全可以（추우니까 입으세요 / 갑시다）", "✅ 可以加過去式（추웠으니까）"], ["-기 때문에", "❌ 通常接客觀陳述句，不接命令/共動句", "✅ 可以加過去式（공부했기 때문에）"]]}, "examples": ["배가 아파서 병원에 갔어요. (肚子痛去了醫院 - 客觀因果)", "시간이 없으니까 서두르세요. (沒時間了請快點 - 主觀催促命令)"], "nuance": "看見句尾有 -(으)세요、-(으)십시오 或 -(으)ㅂ시다，前句原因百分之百選 -(으)니까！"}, {"id": "ref_beg_11", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 10", "title": "Unit 10. Making Requests & Assisting · 請求與給予幫助 (-아/어 주다, -아/어 드릴까요)", "lessons": ["01 V-아/어 주세요 / 주시겠어요?", "02 V-아/어 줄게요 / 줄까요?"], "summary": "在人際交往中尋求他人協助，或主動向他人提供協助的禮貌句型。", "table": {"headers": ["情境", "對平輩/晚輩", "對長輩/尊長 (敬語)"], "rows": [["請求對方幫助自己", "도와주세요 / 도와줄래요?", "도와주시겠어요? / 도와주십시오"], ["主動給予對方幫助", "도와줄게요 / 도와줄까?", "도와드릴게요 / 도와드릴까요?"]]}, "examples": ["사진 좀 찍어 주시겠어요? (能幫我拍張照嗎？)", "제가 짐을 들어 드릴게요. (我來幫您提行李)"], "nuance": "向長輩提供幫助時，動詞 주다 必須替換為敬語 드릴게요 / 드릴까요。"}, {"id": "ref_beg_12", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 11", "title": "Unit 11. Trying & Experiences · 嘗試與經驗 (-아/어 보다, -(으)ㄴ 적이 있다/없다)", "lessons": ["01 V-아/어 보다", "02 V-(으)ㄴ 적이 있다/없다"], "summary": "表達『做看看、嘗試去做』或『曾經有過/沒有過某經歷』。", "table": {"headers": ["文法", "時態形態", "核心語意"], "rows": [["-아/어 보다", "現在/未來: 해 봐요 / 過去: 해 봤어요", "嘗試做某事；過去式表親身經歷體驗過"], ["-(으)ㄴ 적이 있다/없다", "過去冠形詞 + 적이 있다/없다", "具有或不具有某項過去的生活經歷"]]}, "examples": ["이 옷을 한번 입어 보세요. (試穿看看這件衣服)", "제주도에 가 본 적이 있어요. (曾經去過濟州島)"], "nuance": "重複強調時可結合：'가 본 적이 있다'（曾經去體驗過）。"}, {"id": "ref_beg_13", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 12", "title": "Unit 12. Asking Opinions & Suggestions · 徵詢意見與提議 (-(으)ㄹ까요?, -(으)ㅂ시다, -(으)시겠어요?, -(으)ㄹ래요?)", "lessons": ["01 V-(으)ㄹ까요?①②", "02 V-(으)ㅂ시다", "03 V-(으)시겠어요?", "04 V-(으)ㄹ래요?①"], "summary": "邀約朋友、徵求對方想法或向長輩客氣提議的多層次語氣庫。", "table": {"headers": ["句型", "適用關係與語氣", "使用限制"], "rows": [["-(으)ㄹ까요?", "徵求意見（我們一起...好嗎？）", "口語常用邀約提議"], ["-(으)ㅂ시다", "共動命令（我們一起做吧！）", "【嚴禁對長輩使用】！對長輩不敬"], ["-(으)시겠어요?", "對尊長極其客氣的徵詢邀請", "禮貌詢問長輩意向的最佳表達"], ["-(으)ㄹ래요?", "親近朋友間隨和邀約", "口語親暱、非正式場合常用"]]}, "examples": ["점심에 비빔밥을 먹을까요? (午餐吃拌飯好嗎？)", "선생님, 같이 식사하시겠어요? (老師，要一起用餐嗎？)"], "nuance": "絕對不能對老師或老闆說 '식사합시다'（❌），應說 '식사하시겠어요?'（⭕）。"}, {"id": "ref_beg_14", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 13", "title": "Unit 13. Intentions and Plans · 說話者的意志與約定 (-겠어요, -(으)ㄹ게요, -(으)ㄹ래요)", "lessons": ["01 A/V-겠어요①", "02 V-(으)ㄹ게요", "03 V-(으)ㄹ래요②"], "summary": "表達說話者當下的決心、對聽者的承諾約定或堅決意向。", "table": {"headers": ["文法", "說話者心理焦點", "語法特點"], "rows": [["-겠어요", "正式宣布自己的意志或在點餐時表明決定", "常用於格式體宣言（열심히 하겠습니다）"], ["-(으)ㄹ게요", "向對方做出承諾、約定或回應對方要求", "【必須有聽話者】在場承諾；僅限第1人稱主語"], ["-(으)ㄹ래요", "主觀意願強烈陳述（我想/我要...）", "口語親近使用（난 커피 마실래）"]]}, "examples": ["내일 늦지 않고 꼭 갈게요. (我答應明天絕不遲到一定去)", "저는 비빔밥으로 하겠습니다. (我決定要拌飯)"], "nuance": "-(으)ㄹ게요 只能用於第1人稱陳述句，不能用於疑問句（❌갈게요? → ⭕갈까요?）。"}, {"id": "ref_beg_15", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 14", "title": "Unit 14. Background & Explanations · 背景提示與說明 (-(으)ㄴ/는데②, -(으)니까②)", "lessons": ["01 A/V-(으)ㄴ/는데②", "02 V-(으)니까②"], "summary": "在提出請求、建議或問題之前，先行提供客觀背景或前置情境。", "table": {"headers": ["詞尾", "主要功能", "典型例句"], "rows": [["-(으)ㄴ/는데", "提示交談背景、身分說明、委婉提出請求", "여보세요, 저 마크인데요, 민우 씨 있어요?"], ["-(으)니까", "做某事後意外發現新情況", "집에 도착하니까 밤 11시였어요."]]}, "examples": ["지금 백화점에 가는데 같이 갈래요? (現在要去百貨公司，要一起去嗎？)", "창문을 여니까 시원한 바람이 들어왔어요. (一打開窗戶，涼風便迎面吹來)"], "nuance": "電話開場自我介紹身分必備：'저 마크인데요...'。"}, {"id": "ref_beg_16", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 15", "title": "Unit 15. Purpose and Intention · 目的與意圖 (-(으)러 가다, -(으)려고, -기 위해, -기로 하다)", "lessons": ["01 -(으)러 가다/오다", "02 -(으)려고", "03 -(으)려고 하다", "04 N을/를 위해(서), -기 위해(서)", "05 -기로 하다"], "summary": "精確闡述行動的動機與目標：專屬移動目的、一般意圖與鄭重目的。", "table": {"headers": ["目的表達", "結合動詞限制", "語體色彩"], "rows": [["-(으)러 가다/오다", "【僅限搭配移動動詞】 (가다, 오다, 다니다)", "日常生活最自然的前往某地目的"], ["-(으)려고 (하다)", "可接各類普通動詞", "主觀意圖計畫（打算做某事）"], ["-기 위해(서)", "可接各類動詞；名詞接 을/를 위해", "正式書面語、崇高重大目的"], ["-기로 하다", "動詞詞幹 + -기로 하다", "決定/約定做某事（담배를 끊기로 했다）"]]}, "examples": ["책을 사러 서점에 가요. (去書店買書)", "살을 빼려고 매일 운동해요. (為了減肥每天運動)", "가족을 위해서 열심히 일해요. (為了家庭努力工作)"], "nuance": "-(으)러 後面只能接 가다/오다 等移動動詞；-(으)려고 後面可接任意行動。"}, {"id": "ref_beg_17", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 16", "title": "Unit 16. Conditions & Suppositions · 條件與假設 (-(으)면, -(으)려면, -아/어도)", "lessons": ["01 A/V-(으)면", "02 V-(으)려면", "03 A/V-아/어도"], "summary": "韓語基礎假設三劍客：一般條件、目的條件（如果想要的話）與讓步讓行（即使...也）。", "table": {"headers": ["詞尾", "邏輯關係", "核心意義與用法"], "rows": [["-(으)면", "一般假設條件 (If)", "如果滿足前項條件，則會發生後項"], ["-(으)려면", "意圖假設條件 (If you intend to)", "如果想要達成前項目標，就必須做後項"], ["-아/어도", "讓步讓行 (Even if / Although)", "即使前面條件成立，後續結果也不受影響"]]}, "examples": ["시간이 있으면 차 한잔해요. (如果有時間喝杯茶吧)", "한국어를 잘하려면 매일 연습하세요. (如果想學好韓語請每天練習)", "비가 와도 축구를 할 거예요. (即使下雨也要踢足球)"], "nuance": "-(으)려면 是 -(으)려고 하면 的縮略，後句常搭配 -아/어야 하다 或 -(으)세요。"}, {"id": "ref_beg_18", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 17", "title": "Unit 17. Conjecture · 推測表達 (-겠어요②, -(으)ㄹ 거예요②, -(으)ㄴ/는 것 같다)", "lessons": ["01 A/V-겠어요②", "02 A/V-(으)ㄹ 거예요②", "03 A/V-(으)ㄹ까요?③", "04 A/V-(으)ㄴ/는/(으)ㄹ 것 같다"], "summary": "從直觀感受推測到委婉主觀推論的層次區分。", "table": {"headers": ["推測句型", "推測依據與語氣", "例句"], "rows": [["-겠어요", "當場看到事物時的直觀感受推測", "맛있겠어요! (看起來好好吃！)"], ["-(으)ㄹ 거예요", "基於已有常識或客觀依據的自信推論", "지금쯤 비행기가 도착했을 거예요."], ["-(으)ㄴ/는 것 같다", "韓語中最常用的委婉客氣推測（好像...）", "비가 오는 것 같아요. (好像在下雨)"]]}, "examples": ["음식이 정말 맛있겠네요! (直觀推測)", "민우 씨는 참 친절한 것 같아요. (委婉主觀評價)"], "nuance": "-(으)ㄴ/는 것 같다 是韓國人日常會話中最愛用的客氣委婉句型。"}, {"id": "ref_beg_19", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 18", "title": "Unit 18. Changes in Parts of Speech · 詞性變換 (冠形詞形, 名詞化 -기, 副詞化 -게, 感情動詞化 -아/어하다)", "lessons": ["01 冠形詞形 -(으)ㄴ/-는/-(으)ㄹ N", "02 A/V-기", "03 A-게", "04 A-아/어하다"], "summary": "韓語造句進階核心：將動詞/形容詞轉化為修飾語、名詞或副詞。", "table": {"headers": ["詞性轉變", "語法形式", "核心規則"], "rows": [["動詞冠形詞 (修飾名詞)", "過去 -(으)ㄴ / 現在 -는 / 未來 -(으)ㄹ", "읽은 책 (讀過), 읽는 책 (正讀), 읽을 책 (將讀)"], ["形容詞冠形詞", "現在 -(으)ㄴ (예쁜 꽃, 좋은 날씨)", "形容詞現在修飾名詞接 -(으)ㄴ"], ["名詞化 (-기)", "動詞/形容詞 + -기", "轉化為名詞概念（읽기 閱讀, 쓰기 寫作）"], ["副詞化 (-게)", "形容詞 + -게 (맛있게, 예쁘게)", "轉化為副詞修飾後方動詞"], ["第三人稱感情動詞化", "形容詞 + -아/어하다 (슬퍼하다, 기뻐하다)", "形容詞原形只能用於第1人稱；第3人稱必加 -아/어하다"]]}, "examples": ["제가 좋아하는 한국 음식은 불고기예요. (我喜歡的韓國料理)", "방을 깨끗하게 청소했어요. (把房間乾淨地打掃了)", "아이가 강아지를 무서워해요. (孩子害怕小狗)"], "nuance": "第三人稱感情狀態絕對不能直接用形容詞原形（❌아이가 슬퍼요 → ⭕슬퍼해요）。"}, {"id": "ref_beg_20", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 19", "title": "Unit 19. Expressions of State · 狀態表達 (-고 있다[穿戴], -아/어 있다, -아/어지다, -게 되다)", "lessons": ["01 V-고 있다②", "02 V-아/어 있다", "03 A-아/어지다", "04 V-게 되다"], "summary": "細膩區分動作正在進行中 vs 動作完成後的狀態持續存在。", "table": {"headers": ["狀態類別", "語法形式", "核心用法"], "rows": [["穿戴持續", "穿戴動詞 + -고 있다 (모자를 쓰고 있다)", "著裝穿戴完成後，身上持續維持穿戴著的狀態"], ["自動詞狀態持續", "自動詞 + -아/어 있다 (앉아 있다, 열려 있다)", "動作完成後，其結果狀態持續保持（坐著、開著）"], ["漸變轉變", "形容詞 + -아/어지다 (따뜻해지다, 예뻐지다)", "狀態逐漸發生轉變（變得...）"], ["客觀演變/決定", "動詞 + -게 되다 (가게 되다, 알게 되다)", "非主觀意志，受客觀環境影響而自然演變成某局面"]]}, "examples": ["선생님이 안경을 쓰고 계세요. (老師正戴著眼鏡 - 狀態持續)", "문이 활짝 열려 있어요. (門正敞開著 - 結果維持)", "한국에 와서 김치를 잘 먹게 되었어요. (來韓國後變得能吃泡菜了)"], "nuance": "-아/어 있다 只能接自動詞，不能接他動詞（❌밥을 먹어 있다）！"}, {"id": "ref_beg_21", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 20", "title": "Unit 20. Confirming Information · 確認資訊 (-지 않아요?, -(으)ㄴ/는지 알다, -지요?)", "lessons": ["01 A/V-지 않아요?", "02 A/V-(으)ㄴ/는지 알다/모르다", "03 A/V-지요?"], "summary": "向對方核實已知事實、詢問是否知曉某疑問資訊或尋求共鳴。", "table": {"headers": ["句型", "語氣色彩", "典型例句"], "rows": [["-지요? (-죠?)", "尋求認同、向對方確認已知事實 (Right?)", "오늘 날씨가 참 좋지요?"], ["-(으)ㄴ/는지 알다/모르다", "知不知道某疑問詞/某事實", "우체국이 어디에 있는지 아세요?"], ["-지 않아요?", "反問確認、委婉提醒 (Isn't it?)", "저 영화 참 재미있지 않아요?"]]}, "examples": ["내일 2시에 만나는 거지요? (明天2點碰面，對吧？)", "이 문제가 왜 틀렸는지 모르겠어요. (不知道這題為什麼錯了)"], "nuance": "口語中 -지요 常簡縮為 -죠。"}, {"id": "ref_beg_22", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 21", "title": "Unit 21. Discovery and Surprise · 感嘆與發現 (-는군요 / -군요, -네요)", "lessons": ["01 A/V-는군요 / -군요", "02 A/V-네요"], "summary": "當場發現新事實、目睹新情境時，自然脫口而出的驚嘆與感觸。", "table": {"headers": ["感嘆詞尾", "結合詞性", "語意特點"], "rows": [["-는군요 / -군요", "動詞 -는군요 / 形容詞 -군요 / 名詞 -(이)군요", "知曉某新事實後的理性領悟感嘆（原來如此啊！）"], ["-네요", "動詞/形容詞直接接 -네요", "親身體驗或目睹時的直觀驚喜感嘆（哇，真好呢！）"]]}, "examples": ["한국어를 정말 잘하시는군요! (原來您韓語講得這麼好！)", "오늘 날씨가 정말 춥네요! (今天天氣真冷啊！)"], "nuance": "-네요 是韓國人日常會話中使用頻率極高的親切感嘆詞尾。"}, {"id": "ref_beg_23", "book": "beginner", "level": "初級 (Beginning)", "chapter_num": "初級 · Unit 22", "title": "Unit 22. Additional Endings · 附加終結詞尾 (-(으)ㄴ가요?, -나요?, -(으)ㄹ래요)", "lessons": ["01 A-(으)ㄴ가요?, V-나요?", "02 A/V-(으)ㄹ래요"], "summary": "使對話更為溫和柔和的疑問句與隨和意向句型。", "table": {"headers": ["詞尾", "結合詞性", "語意與語氣效果"], "rows": [["-(으)ㄴ가요?", "形容詞有收音 -은가요, 無收音 -ㄴ가요", "極其溫柔、委婉禮貌的提問語氣"], ["-나요?", "動詞/時態接 -나요? (먹나요, 갔나요)", "親切柔和的提問，避免咄咄逼人"], ["-(으)ㄹ래요", "動詞詞幹 + -(으)ㄹ래요", "隨和陳述自己意願或詢問對方"]]}, "examples": ["백화점에 사람이 많은가요? (  "07 -(으)ㄹ지도 모르다"], "summary": "中級第1章核心推測大系，從外觀直觀、客觀線索、推測背景、推測提議到未料到的對比。", "table": {"headers": ["文法", "推測依據與特點", "限制與禁忌"], "rows": [["-아/어 보이다", "根據外表/氣色直觀感受 (You look...)", "【僅限形容詞】；嚴禁接動詞 (❌잘해 보여요)"], ["-(으)ㄴ/는 모양이다", "看見/聽聞客觀事實後的推論", "常搭 -(으)ㄴ/는 걸 보니까；【說話者親身經歷不可用】"], ["-(으)ㄹ 텐데", "對未來/現況強烈推測之背景情境", "-(으)ㄴ/는데 之推測版；句尾可為 -(으)ㄹ 텐데요"], ["-(으)ㄹ 테니까", "推測原因並提出提議或意志承諾", "後句【嚴禁接 감사하다 / 미안하다】！"], ["-(으)ㄹ걸요", "說話者單方掌握不確定推測 (我看大概...吧)", "僅用於口語親近朋友；雙方共知事實不能用"], ["-(으)ㄴ/는 줄 몰랐다(알았다)", "原本不知道 / 原以為是那樣但實際相反", "表達意料之外與事實衝突"], ["-(으)ㄹ지도 모르다", "可能性偏低的不確定推測 (說不定...)", "對面臨重要考試/大事的人不可使用，顯得不禮貌"]]}, "examples": ["얼굴이 피곤해 보여요. (臉色看起來疲倦)", "등산복을 입은 걸 보니까 산에 가는 모양이에요. (看穿著推斷去爬山)", "고추장을 많이 넣으면 매울 테니까 조금만 넣으세요. (怕會辣所以少放點)"], "nuance": "-(으)ㄹ 텐데 vs -(으)ㄹ 테니까：前者可接感謝遺憾（바쁘실 텐데 와 주셔서 감사합니다），後者後句絕對不可接感謝遺憾！"}, {"id": "ref_mid_27", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 02장", "title": "02장 대조를 나타낼 때 · 대조 (Expressing Contrast)", "lessons": ["01 -기는 하지만, -기는 -지만", "02 -(으)ㄴ/는 반면에", "03 -(으)ㄴ/는데도"], "summary": "中級第2章對比文法，強調讓步認同、正反兩面特質並存，以及出乎意料的逆境結果。", "table": {"headers": ["文法", "核心語義", "主語與語法限制"], "rows": [["-기는 하지만", "承認前項事實，但強調後項相反意見", "【前後主語必須同一人】（-지만 則主語可不同）"], ["-(으)ㄴ/는 반면에", "同時陳述事物的優缺點或正反兩面", "前項優點 vs 後項缺點（速度快但擁擠）"], ["-(으)ㄴ/는데도", "儘管處於前項狀態，後項依然出乎意料", "強調時可加 불구하고: -(으)ㄴ/는데도 불구하고"]]}, "examples": ["그 신발이 좋기는 하지만 너무 비싸요. (鞋子雖好但太貴)", "일은 많은 반면에 월급은 적어요. (工作多相反薪水少)", "어제 푹 잤는데도 피곤해요. (儘管睡飽了還是很累)"], "nuance": "-기는 하지만 口語中常縮寫為 -긴 하지만 或重複動詞 -긴 -지만 (읽긴 읽었지만)。"}, {"id": "ref_mid_28", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 03장", "title": "03장 서술체와 반말체 · 서술체와 반말체 (Narrative & Informal Forms)", "lessons": ["01 서술체", "02 반말체"], "summary": "書面客觀發表/日記體與生活親近朋友/晚輩平語體轉換體系。", "table": {"headers": ["項目", "書面客觀敘述體 (서술체)", "朋友/晚輩平語體 (반말체)"], "rows": [["動詞現在式", "-ㄴ다 (無收音) / -는다 (有收音)", "-아/어 (가, 먹어)"], ["形容詞現在式", "-다 (크다, 작다, 좋다, 슬프지 않다)", "-아/어 (커, 작아, 좋아)"], ["名詞現在式", "-(이)다 (학생이다, 친구다)", "-(이)야 (학생이야, 친구야)"], ["疑問句", "-는가? / -(으)ㄴ가?", "-아/어? / -니? (❌니不可對長輩)"], ["命令句", "公文不常用", "-아/어(라) (❌아/어라不可對長輩)"]]}, "examples": ["나는 한국어를 공부하는 학생이다. (客觀敘述)", "동현아, 점심시간이야. 같이 밥 먹으러 가자. (平語親暱交談)"], "nuance": "呼格助詞：名字有收音加 '아' (동현아)，無收音加 '야' (은혜야)，但外國人名字不可接 아/야 (❌크리스틴아 → ⭕크리스틴)！"}, {"id": "ref_mid_29", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 04장", "title": "04장 이유를 나타낼 때 · 이유 (Expressing Reasons)", "lessons": ["01 -거든요", "02 -잖아요", "03 -느라고", "04 -는 바람에", "05 -(으)ㄴ/는 탓에", "06 -고 해서", "07 -(으)ㄹ까 봐"], "summary": "中級最重要也是 TOPIK 最常考的 7 大原因句型，依據主觀耽誤、客觀突發、過失歸咎細分。", "table": {"headers": ["文法", "原因性質", "主語一致性", "語法限制與禁忌"], "rows": [["-거든요", "解釋對方不知道的原因", "無限制", "口語體；【不可做對話第一句】"], ["-잖아요", "提醒對方本已知曉的事實/責怪", "無限制", "口語體；提醒或怪對方不聽勸"], ["-느라고", "主觀意志行為耗時費力耽誤後事", "【必須同一主語】", "僅接動詞；前句禁加過去式；後句禁接命令/共動"], ["-는 바람에", "未料到的客觀突發意外", "可同可不同", "僅接動詞；【後句必為過去式】；禁接命令/共動"], ["-(으)ㄴ/는 탓에", "壞結果歸咎於某缺點或過失", "可同可不同", "好結果必須改用 -(으)ㄴ/는 덕분에"], ["-고 해서", "多個原因中列舉其一為代表", "可同可不同", "常搭 N도 V-고 해서"], ["-(으)ㄹ까 봐", "擔心害怕某事發生而採取預防", "可同可不同", "後句為預防動作，不可為未來計畫"]]}, "examples": ["숙제하느라고 잠을 못 잤어요. (忙於寫功課耽誤睡覺)", "갑자기 비가 오는 바람에 옷이 다 젖었어요. (突發下雨導致淋濕)", "성격이 급한 탓에 실수가 잦아요. (性急導致失誤頻繁)"], "nuance": "正面良好結果絕對不能用 -는 바람에 或 -는 탓에，必須使用 '-(으)ㄴ/는 덕분에'！"}, {"id": "ref_mid_30", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 05장", "title": "05장 다른 사람의 말이나 글을 인용할 때 · 인용 (Citing Others)", "lessons": ["01 -다고요?", "02 -다고 하던데", "03 -다면서요?", "04 -다니요?"], "summary": "轉述引用延伸句型：反問確認、聽聞提議、求證當事人及難以置信之驚嘆。", "table": {"headers": ["句型", "心理狀態與語意", "核心規則與限制"], "rows": [["-다고요?", "沒聽清或難以置信，向對方重複反問確認", "依原句型：-ㄴ/는다고요?, -냐고요?, -(으)라고요?, -자고요?"], ["-다고 하던데", "回想聽聞的訊息，後句提出建議或詢問", "口語常縮為 -다던데 (용산이 싸다던데 가 보세요)"], ["-다면서요?", "聽第三方所說，向當事人核實求證", "【自己親眼看見的事實絕對不能用】！"], ["-다니요?", "對聽到的事實感到極度震驚、不可思議", "저분이 사장님이시라니요? 택배 기사님인 줄 알았어요!"]]}, "examples": ["비가 온다고요? 맑았는데? (反問確認)", "자야 씨, 남자 친구랑 헤어졌다면서요? (求證傳聞)"], "nuance": "轉述命令句中要求『給我』時，原句為 나에게 주세요，轉述必須改為 자기에게 달라고 하다！"}, {"id": "ref_mid_31", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 06장", "title": "06장 결심과 의도를 나타낼 때 · 결심과 의도 (Resolution & Intent)", "lessons": ["01 -(으)ㄹ까 하다", "02 -고자", "03 -(으)려던 참이다", "04 -(으)ㄹ 겸 -(으)ㄹ 겸", "05 -아/어야지요"], "summary": "表達個人粗略打算、正式莊重意圖、巧合正打算、一舉兩得兼顧與自我勉勵。", "table": {"headers": ["文法", "語體與意圖成熟度", "語法規則"], "rows": [["-(으)ㄹ까 하다", "尚未最終敲定的粗略打算 (Thinking of...)", "僅能用於陳述句，不可接命令/共動/未來式"], ["-고자", "正式場合（演講/面試/報告）之目標目的", "前後主語必須一致；前句禁加過去式"], ["-(으)려던 참이다", "正打算做對方剛好提議的事情", "不能用於遙遠未來的計畫"], ["-(으)ㄹ 겸", "同時兼顧兩個以上的目的 (既...又...)", "常搭 N도 V-(으)ㄹ 겸 N도 V-(으)ㄹ 겸 (해서)"], ["-아/어야지요", "下定決心或自我勉勵 (一定要...)", "自言自語時為 -아/어야지"]]}, "examples": ["다음 달부터 요가를 배울까 해요. (打算學瑜伽)", "꿈을 펼치고자 지원했습니다. (為施展抱負而應聘)", "안 그래도 나도 보려던 참이었어요. (正好我也正打算看)"], "nuance": "-(으)ㄹ까 하다 否定型為 '안 -(으)ㄹ까 하다' 或 '-지 말까 하다'。"}, {"id": "ref_mid_32", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 07장", "title": "07장 추천과 조언을 나타낼 때 · 추천과 조언 (Recommendations & Advice)", "lessons": ["01 -(으)ㄹ 만하다", "02 -도록 하다", "03 -지 그래요?"], "summary": "向他人推薦值得一試之事物、委婉提出建議或勸告對方不妨一試。", "table": {"headers": ["文法", "推薦與建議語氣", "用法重點"], "rows": [["-(으)ㄹ 만하다", "值得一做；或雖不完全滿意但尚可接受", "가 볼 만해요 (值得一去) / 아직 먹을 만해요 (還能吃)"], ["-도록 하다", "指示或勸告對方去做某事", "後常接 -도록 하세요 / -도록 합시다；答覆用 -도록 하겠습니다"], ["-지 그래요?", "委婉提議（怎麼不.../不妨...）", "過去式 -지 그랬어요? 表遺憾或怪責對方當初沒做"]]}, "examples": ["가을 설악산은 꼭 가 볼 만해요. (雪嶽山值得一去)", "담배를 끊도록 하세요. (請試著戒煙)", "혼자 앓지 말고 병원에 가 보지 그랬어요? (當初怎麼不去醫院？)"], "nuance": "-지 그랬어요? 帶有事後惋惜怪責語氣（早知道當初就該那麼做）。"}, {"id": "ref_mid_33", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 08장", "title": "08장 회상을 나타낼 때 · 회상 (Expressing Recollection)", "lessons": ["01 -던", "02 -더라고요", "03 -던데요"], "summary": "回想過去反覆持續的習慣、親身見證的體驗，或對他人意見提出不同回憶。", "table": {"headers": ["回想詞尾", "核心焦點", "主語與語法限制"], "rows": [["-던", "過去反覆持續或未完之習慣 (修飾名詞)", "現在該動作已徹底結束（우리가 자주 가던 식당）"], ["-더라고요", "親自看見、聽見或體驗後的回想陳述", "【主語不可為第1人稱】（個人心理感受除外）"], ["-던데요", "回想過去所見，對對方的話提出相左見聞", "지난번에 가 보니까 집이 꽤 크던데요"]]}, "examples": ["어렸을 때 살던 동네에 가 보았어요. (小時候住過的村子)", "제주도에 가 보니까 경치가 정말 아름답더라고요. (親見風景極美)"], "nuance": "-더라고요 不能用於早已熟知的事實（❌제 고향은 서울이더라고요）。"}, {"id": "ref_mid_34", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 09장", "title": "09장 피동을 나타낼 때 · 피동 (Passive Expressions)", "lessons": ["01 단어 피동 (-이/히/리/기-)", "02 -아/어지다", "03 -게 되다"], "summary": "被動語態三大形式：單詞短被動、長被動 -아/어지다 與客觀演變 -게 되다。", "table": {"headers": ["被動類型", "結合形式", "代表詞與語義"], "rows": [["單詞短被動", "-이/히/리/기- 接尾詞", "보다→보이다, 닫다→닫히다, 열다→열리다, 잡다→잡히다"], ["長被動 (-아/어지다)", "無法加短後綴的動詞 + -아/어지다", "만들어지다, 켜지다, 쏟아지다"], ["客觀演變 (-게 되다)", "動詞詞幹 + -게 되다", "非主觀意志，受外在客觀環境影響而自然演變成某局面"]]}, "examples": ["도둑이 경찰에게 잡혔어요. (小偷被警察抓住)", "휴대전화가 고장 나서 잘 안 켜져요. (手機壞了開不了機)", "한국에 와서 살게 되었어요. (因故來到韓國生活)"], "nuance": "被動句中：施事者接 '에게/한테'，受事者變為主語接 '이/가'。"}, {"id": "ref_mid_35", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 10장", "title": "10장 사동을 나타낼 때 · 사동 (Causative Expressions)", "lessons": ["01 단어 사동 (-이/히/리/기/우/추-)", "02 -게 하다"], "summary": "使動語態：促使、指使、命令或允許他人執行某動作。", "table": {"headers": ["使動類型", "語法形式", "直接接觸 vs 間接使喚"], "rows": [["單詞短使動", "-이/히/리/기/우/추- 接尾詞", "먹이다(餵), 읽히다(讓讀), 입히다(給穿), 깨우다(叫醒)；多伴隨直接身體接觸"], ["長使動 (-게 하다)", "動詞/形容詞 + -게 하다", "선생님이 학생들을 쉬게 하셨어요；多為口頭指示、間接使喚或允許"]]}, "examples": ["엄마가 아이에게 밥을 먹여요. (媽媽親手餵孩子吃飯)", "선생님이 학생에게 책을 읽혔어요. (老師讓學生讀書)"], "nuance": "同形辨析：'보이다' 既可是被動（看得見），亦可是使動（展示給人看）；'읽히다' 亦兼具被讀與使讀。"}, {"id": "ref_mid_36", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 11장", "title": "11장 조건을 나타낼 때 · 조건 (Expressing Conditions)", "lessons": ["01 -아/어야", "02 -거든"], "summary": "先決必要條件與口語假設條件。", "table": {"headers": ["條件詞尾", "條件強度", "後句語法限制"], "rows": [["-아/어야", "實現後項必不可少的先決條件（只有...才）", "【後句嚴禁接命令句與共動句】；可加 -아/어야만"], ["-거든", "口語條件假設（如果真的...的話）", "【後句必須接命令句(-으세요)、共動句(-자)或意志句】"]]}, "examples": ["건강해야 무슨 일이든 할 수 있어요. (只有健康才能做任何事)", "바쁘지 않거든 잠깐 만납시다. (如果不忙的話見個面吧)"], "nuance": "-거든 後句必須是命令或提議句；-아/어야 後句嚴禁接命令或提議句！"}, {"id": "ref_mid_37", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 12장", "title": "12장 추가를 나타낼 때 · 추가 (Expressing Additional Information)", "lessons": ["01 -(으)ㄹ 뿐만 아니라", "02 -(으)ㄴ/는 데다가", "03 조차", "04 만 해도"], "summary": "遞進追加：不僅...而且...、雪上加霜/好上加好、連最基本的都、單單就...而言。", "table": {"headers": ["詞尾/助詞", "核心功能", "情感傾向與規則"], "rows": [["-(으)ㄹ 뿐만 아니라", "不僅...而且...", "前後情感方向必須一致（同為褒義或同為貶義）"], ["-(으)ㄴ/는 데다가", "在...之上又加上...", "好上加好或雪上加霜；前後主語一致"], ["조차", "連最基本的/最極端的...都", "通常用於負面、極端、難以置信的情境 (이름조차 몰라요)"], ["만 해도", "單單就...而言", "列舉具體典型例子證明前述論點 (제 친구들만 해도)"]]}, "examples": ["책을 많이 읽을 뿐만 아니라 신문도 매일 읽어요. (不僅看書而且看報)", "비가 오는 데다가 바람까지 불어요. (又下雨又颳風)"], "nuance": "N조차 與 N마저 區別：조차 側重連最起碼的都沒有；마저 側重連最後僅存的一個都被剝奪。"}, {"id": "ref_mid_38", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 13장", "title": "13장 도중을 나타낼 때 · 도중 (Expressing Mid-Action)", "lessons": ["01 -는 길에", "02 -다가"], "summary": "動作進行途中順道做某事，或動作被打斷轉換至新動作。", "table": {"headers": ["文法", "動作進行狀態", "動詞結合限制"], "rows": [["-는 길에", "在前往某地的移動路途之中順路做某事", "【僅限搭配移動動詞】 (가다, 오다, 퇴근하다)"], ["-다가", "某動作進行中途中斷並轉換成另一動作", "前後主語必須同一人 (TV를 보다가 잠이 들었다)"]]}, "examples": ["퇴근하는 길에 마트에 들렀어요. (下班途中順道去超市)", "밥을 먹다가 전화를 받았어요. (吃飯吃到一半接了電話)"], "nuance": "-다가 前後主語必須同一人（❌내가 가다가 친구가 왔다）。"}, {"id": "ref_mid_39", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 14장", "title": "14장 정도를 나타낼 때 · 정도 (Expressing Degree)", "lessons": ["01 -(으)ㄹ 정도로", "02 만 하다", "03 -(으)ㄴ/는 만큼"], "summary": "形容事物達到何種驚人程度、大小比擬及按比例衡量。", "table": {"headers": ["程度表達", "衡量方式", "代表例句"], "rows": [["-(으)ㄹ 정도로", "達到...的地步/程度", "쓰러질 정도로 피곤했어요 (累到快要昏倒)"], ["만 하다", "大小、數量、程度比擬", "얼굴이 주먹만 해요 (臉蛋像拳頭一樣小)"], ["-(으)ㄴ/는 만큼", "與...成比例的程度", "각자 먹은 만큼 돈을 냅시다 (按各自吃的分量付錢)"]]}, "examples": ["눈물이 날 정도로 감동적이었어요. (感動到流淚的程度)", "집이 운동장만 해요. (房子像操場一樣大)"], "nuance": "-(으)ㄹ 만큼 與 -(으)ㄹ 정도로 在表達程度時多可互換。"}, {"id": "ref_mid_40", "book": "intermediate", "level": "中級 (Intermediate)", "chapter_num": "中級 · 15장", "title": "15장 선택을 나타낼 때 · 선택 (Expressing Choice)", "lessons": ["01 아무+(이)나/아무+도", "02 (이)나", "03 (이)라도", "04 -든지 -든지", "05 -(으)ㄴ/는 대신에"], "summary": "在各種選項中表達無條件任意、次佳退讓、代價補償與無論 e": "01장 선택을 나타낼 때 · 선택 (Choice: -느니, -(으)ㄹ 바에야, -건 -건, -(느)ㄴ다기보다는)", "lessons": ["01 -느니", "02 -(으)ㄹ 바에야", "03 -건 -건", "04 -(느)ㄴ다기보다는"], "summary": "高級選擇大系：兩害相權取其輕之無奈抉擇、既然前項不可取倒不如、無論如何結果皆同，以及與其說是前者不如說是後者。", "table": {"headers": ["文法", "心理抉擇與取向", "核心搭配與語氣"], "rows": [["-느니", "兩者都很討厭，但前者比後者更糟，兩害相權取其輕", "常搭 '차라리', '차라리 ~는 게 낫다'"], ["-(으)ㄹ 바에야", "既然前項如此糟糕無意義，倒不如索性選擇後者", "常搭 '차라리', '아예' (與 -느니 意義極近)"], ["-건 -건", "無論是前者還是後者，後續結果或態度不受影響", "縮自 -거나 -거나，常搭 간에 / 상관없이"], ["-(느)ㄴ다기보다는", "與其用前項形容，倒不如用後項更為精確", "常接 ~는 편이다 / ~는 표현이 맞다"]]}, "examples": ["적성에 맞지 않는 일을 하느니 차라리 몸이 힘든 일을 하겠다.", "비가 오건 눈이 오건 행사는 진행됩니다.", "좋아한다기보다는 존경한다는 표현이 맞아요."], "nuance": "-(으)ㄹ 바에야 與 -느니 僅能接動詞；-(느)ㄴ다기보다는 動詞/形容詞/名詞皆可接。"}, {"id": "ref_adv_53", "book": "advanced", "level": "高級 (Advanced)", "chapter_num": "高級 · 02장", "title": "02장 인용을 나타낼 때 · 인용 (Citations: 보고, -(느)ㄴ다니까, -(느)ㄴ다면서, 에 의하면)", "lessons": ["01 보고", "02 -(느)ㄴ다니까", "03 -(느)ㄴ다면서", "04 에 의하면"], "summary": "高級引用大系：對某人傳達命令指示、聽聞原因採取行動、邊說邊做，以及根據客觀權威數據來源。", "table": {"headers": ["文法", "引導角色", "語法規則與限制"], "rows": [["보고 / 더러", "引導間接引語指示命令之對象人稱", "相當於 한테 / 에게；【非引述句不可任意替換】"], ["-(느)ㄴ다니까", "以聽說的事情或他人承諾作為行動依據", "縮自 -(느)ㄴ다고 하니까；前後主語多不同"], ["-(느)ㄴ다면서", "邊說著前句的話邊做後句動作", "縮自 -(느)ㄴ다고 하면서；前後主語必須同一人"], ["에 의하면", "指出新聞調查、統計報告等依據來源", "可換為 에 따르면；時態永遠為現在式"]]}, "examples": ["팀장님이 김 대리보고 보고서를 다시 쓰라고 하셨다.", "소피아 씨가 아프다니까 우리가 도와줍시다.", "통계청 발표에 의하면 청년 실업률이 감소했다고 한다."], "nuance": "-(느)ㄴ다면서 放在句中表邊說邊做（主語一致）；放在句尾 -다면서요? 則為向當事人確認傳聞。"}, {"id": "ref_adv_54", "book": "advanced", "level": "高級 (Advanced)", "chapter_num": "高級 · 03장", "title": "03장 명사화됨을 나타낼 때 · 명사화 (Nominalization: -(으)ㅁ, -는데, -는 바)", "lessons": ["01 -(으)ㅁ", "02 -는데", "03 -는 바"], "summary": "將動詞形容詞名詞化：公文客觀事實記錄、在某方面/情境之中，以及所感受/所經歷之事物。", "table": {"headers": ["名詞化形式", "適用領域與文體", "典型例句與搭配"], "rows": [["-(으)ㅁ", "公文告示、書面記錄、確定之客觀事實", "관계자 외 출입을 금함 (謝絕非相關人員進入)"], ["-는 데", "在做某事方面、在某種情境下", "常搭 도움이 되다 / 필요하다 / 시간이 걸리다"], ["-는 바", "所...的事物、內容或結果 (正式書面語)", "조사한 바에 의하면, 느낀 바를 발표하다"]]}, "examples": ["물건이 모두 매진되었음을 보고했다.", "이 책은 한국 문화를 이해하는 데 좋은 길잡이다.", "앞서 언급한 바와 같이 치료법이 다르다."], "nuance": "-(으)ㅁ 常用於確定已知之客觀事實；-기 則常用於期盼、待辦清單或尚未發生之動作。"}, {"id": "ref_adv_55", "book": "advanced", "level": "高級 (Advanced)", "chapter_num": "高級 · 04장", "title": "04장 원인과 이유를 나타낼 때 · 원인과 이유 (Causes & Reasons: 11大高級原因句型)", "lessons": ["01 -(으)로 인해서", "02 -는 통에", "03 -(으)로 말미암아", "04 -느니만큼", "05 -는 이상", "06 -기로서니", "07 -기에 망정이지", "08 -(느)ㄴ답시고", "09 -(으)ㅁ으로써", "10 -기에", "11 -길래"], "summary": "高級最龐大原因體系：負面混亂吵雜、誘因肇始、既然成定局、幸虧免遭大禍、自詡搞砸、藉由手段及口語觸發。", "table": {"headers": ["高級原因文法", "核心情境與心理色彩", "主要語法禁忌"], "rows": [["-는 통에", "在喧鬧混亂失控的場面下導致不良結果", "僅接動詞；嚴禁接命令/共動句；僅限壞結果"], ["-(으)로 말미암아", "以某事物或現象為導火線引發重大後果", "正式書面語；動詞形容詞接 -(으)ㅁ으로 말미암아"], ["-는 이상", "既然事實已定局，就理應承擔相應責任", "後句常接 -아/어야 한다 / -(으)ㄹ 수밖에 없다"], ["-기에 망정이지", "幸虧做了前事，否則差點遭遇嚴重下場", "後句必搭 -(으)ㄹ 뻔했다 / -았/었을 것이다"], ["-(느)ㄴ답시고", "聲稱自以為是要做好事，結果卻搞砸不滿", "帶有譏諷或自嘲；僅接動詞"], ["-길래", "看見/聽聞客觀事實觸發我做出後續行動", "口語體；後句嚴禁接命令/共動句！書面換為 -기에"]]}, "examples": ["아이들이 떠드는 통에 공부를 못했어요.", "서행 운전을 했기에 망정이지 큰 사고가 날 뻔했다.", "남편이 도와준답시고 주방을 난장판으로 만들었다."], "nuance": "-기로서니 承認前情但反詰後續行為太過分（아무리 바쁘기로서니 전화도 못 해요?）。"}, {"id": "ref_adv_56", "book": "advanced", "level": "高級 (Advanced)", "chapter_num": "高級 · 05장", "title": "05장 가정 상황을 나타낼 때 · 가정 상황 (Hypothetical Situations: -더라도, -(으)ㄹ지라도, -(으)ㄴ들, -(으)ㄹ망정, -(느)ㄴ다고 치다, -는 셈치다)", "lessons": ["01 -더라도", "02 -(으)ㄹ지라도", "03 -(으)ㄴ들", "04 -(으)ㄹ망정", "05 -(느)ㄴ다고 치다", "06 -는 셈치다"], "summary": "高級假設讓步：日常讓步、莊重書面縱使、強烈反詰否定、寧死不屈守底線、姑且算作與自我心理開解。", "table": {"headers": ["文法", "語體莊重度與修辭", "語法規則與典型搭配"], "rows": [["-더라도", "普遍讓步假設（即使...也依舊...）", "口語書面皆常用；常搭 아무리"], ["-(으)ㄹ지라도", "極其莊重典雅之書面讓步（縱使...）", "常搭 비록, 설령；展現意志堅定不移"], ["-(으)ㄴ들", "強烈反詰反問修辭（就算...又能如何？）", "後句幾乎必為反問句 (무슨 소용이 있는가?)"], ["-(으)ㄹ망정", "寧死不屈守底線 / 雖有缺點但至少守住原則", "A-(으)ㄹ망정 B는 절대 안 한다 (寧死不屈)"], ["-(느)ㄴ다고 치다", "姑且退讓承認對方理由，但反駁後續依然不妥", "常接 -다고 치더라도 / -다고 치고"], ["-는 셈치다", "心理上權當是如此，以自我寬慰釋懷", "속는 셈치고 믿어보다 / 기부한 셈치다"]]}, "examples": ["비록 시련이 닥칠지라도 포기하지 않겠다.", "이미 지나간 일을 후회한들 무슨 소용이 있겠어요?", "굶어 죽을망정 비열한 돈은 받지 않겠다."], "nuance": "-는 셈치다 只能接動詞；-(느)ㄴ다고 치다 動詞/形容詞/名詞皆可接。"}, {"id": "ref_adv_57", "book": "advanced", "level": "高級 (Advanced)", "chapter_num": "高級 · 06장", "title": "06장 순차적 행동을 나타낼 때 · 순차적 행동 (Sequential Actions: -기가 무섭게, -자)", "lessons": ["01 -기가 무섭게", "02 -자"], "summary": "緊密順序：前動作剛一結束，後續動作以迅雷不及掩耳之勢緊接著發生。", "table": {"headers": ["詞尾", "動作間隔速度", "用法重點"], "rows": [["-기가 무섭게", "前動作一結束立刻發生（極其誇張之速度）", "可換為 -기 바쁘게 (백화점 문이 열리기가 무섭게)"], ["-자", "前動作剛完後動作緊隨，或前事成為後事的契機", "書面語常用；後句主語可不同"]]}, "examples": ["수업이 끝나기가 무섭게 식당으로 달려갔어요.", "공연이 시작되자 조명이 꺼졌다."], "nuance": "-자 與 -자마자 相比，-자 書面語色彩更濃，且可自然引導因果契機。"}, {"id": "ref_adv_58", "book": "advanced", "level": "高級 (Advanced)", "chapter_num": "高級 · 07장", "title": "07장 조건과 결정을 나타낼 때 · 조건과 결정 (Conditions & Decisions: -는 한, -(으)ㄹ라치면, -노라면, -느냐에 달려 있다, -기 나름이다)", "lessons": ["01 -는 한", "02 -(으)ㄹ라치면", "03 -노라면", "04 -느냐에 달려 있다", "05 -기 나름이다"], "summary": "條件限度、每當剛打算做某事就被打擾、只要持續做便會、取決於何者以及全憑怎樣去做。", "table": {"headers": ["文法", "核心邏輯", "代表例句"], "rows": [["-는 한", "只要處於...的範圍限度內", "내가 살아 있는 한 너를 지켜 주겠다"], ["-(으)ㄹ라치면", "每當剛打算做某事，總被意外打擾未能如願", "공부 좀 할라치면 친구에게서 전화가 온다"], ["-노라면", "如果持續反覆進行前動作，自然會發現/感悟", "옛 노래를 듣노라면 고향 생각이 난다"], ["-느냐에 달려 있다", "某事之成敗結果取決於前項", "성공은 얼마나 노력하느냐에 달려 있다"], ["-기 나름이다", "全憑如何對待/因人因做法而異", "행복은 생각하기 나름이다"]]}, "examples": ["숨을 쉬는 한 희망은 있다.", "외출할라치면 꼭 손님이 찾아온다."], "nuance": "-(으)ㄹ라치면 帶有抱怨無奈語氣（剛想做就被破壞）。"}, {"id": "ref_adv_59", "book": "advanced", "level": "高級 (Advanced)", "chapter_num": "高級 · 08장", "title": "08장 따로 함과 같이 함을 나타낼 때 · 따로 함과 같이 함 (Separately & Together: 은/는 대로, -는 김에)", "lessons": ["01 은/는 대로", "02 -는 김에"], "summary": "按照前述原樣分別進行，或藉由做某事的良機順便完成另一件事。", "table": {"headers": ["文法", "核心概念", "例句與用法"], "rows": [["은/는 대로", "按照、各自照著原有方式進行", "생각나는 대로 말해 보세요"], ["-는 김에", "趁著...的機會順便做某事", "마트에 가는 김에 우유 좀 사 와"]]}, "examples": ["각자 계획한 대로 움직입시다.", "외출한 김에 은행 일도 보고 왔다."], "nuance": "-는 김에 只能用於順路順便做的非刻意安排動作。"}, {"id": "ref_adv_60", "book": "advanced", "level": "高級 (Advanced)", "chapter_num": "高級 · 09장", "title": "09장 대조와 반대를 나타낼 때 · 대조와 반대 (Contrast & Opposition: -건만     // --- Sound Synthesis (Web Audio API - Zero External Dependencies) ---
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playPopSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch(e) {}
    }

    function playSuccessChime() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 (Bright Major Chord)
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const startTime = ctx.currentTime + (idx * 0.07);
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.2, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.35);
        });
      } catch(e) {}
    }

    function playWrongBuzzer() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch(e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-toggle-btn');
      btn.textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled) playPopSound();
    }

    function applyCombinedFilters(shouldShuffle = true) {
      currentQuestions = RAW_QUESTIONS.filter(q => {
        const matchBook = (currentBookFilter === 'all' || q.book === currentBookFilter);
        const matchType = (currentTypeFilter === 'all' || q.type === currentTypeFilter);
        return matchBook && matchType;
      });

      if (currentQuestions.length === 0) {
        currentQuestions = RAW_QUESTIONS.filter(q => currentBookFilter === 'all' || q.book === currentBookFilter);

    }

    let currentQuestions = [...RAW_QUESTIONS];
    let currentIndex = 0;
    let answered = false;

    let userState = {
      xp: 0,
      streak: 0,
      maxStreak: 0,
      hearts: 5,
      totalAnswered: 0,
      totalCorrect: 0,
      mistakeIds: [],
      autoShuffleOnLaunch: true,
      lastActiveIndex: 0
    };

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function skipQuestion() {
      playPopSound();
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
      } else {
        shuffleCurrentQuestions(false);
      }
      renderCurrentQuestion();
    }

    function loadState() {
      try {
        const saved = localStorage.getItem('kg_mobile_state');
        if (saved) {
          userState = Object.assign(userState, JSON.parse(saved));
        }
      } catch(e) {}
      updateHeaderStats();
    }

    function saveState() {
      try {
        localStorage.setItem('kg_mobile_state', JSON.stringify(userState));
      } catch(e) {}
      updateHeaderStats();
    }

    function updateHeaderStats() {
      document.getElementById('streak-count').textContent = userState.streak;
      document.getElementById('xp-count').textContent = userState.xp;
      document.getElementById('hearts-count').textContent = userState.hearts;

      document.getElementById('stat-total-score').textContent = userState.xp;
      document.getElementById('stat-max-streak').textContent = userState.maxStreak;
      document.getElementById('stat-answered').textContent = userState.totalAnswered;
      const acc = userState.totalAnswered > 0 ? Math.round((userState.totalCorrect / userState.totalAnswered) * 100) : 0;
      document.getElementById('stat-accuracy').textContent = acc + '%';
    }



    function renderCurrentQuestion() {
      const arena = document.getElementById('quiz-arena');
      const progressBar = document.getElementById('progress-bar');
      const drawer = document.getElementById('feedback-drawer');
      drawer.classList.remove('open');
      answered = false;

      if (currentQuestions.length === 0) {
        arena.innerHTML = '<div style="text-align:center; padding:40px;"><h3>沒有相應題目</h3></div>';
        return;
      }

      const q = currentQuestions[currentIndex];
      const progressPercent = ((currentIndex + 1) / currentQuestions.length) * 100;
      progressBar.style.width = progressPercent + '%';

      let badgeClass = 'badge-beg';
      if (q.book === 'intermediate') badgeClass = 'badge-mid';
      if (q.book === 'advanced') badgeClass = 'badge-adv';

      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        optionsHtml += `
          <button class="chunky-option" id="opt-${idx}" onclick="handleOptionSelect(${idx})">
            <div class="option-key">${idx + 1}</div>
            <div style="flex:1;">${escapeHtml(opt)}</div>
          </button>
        `;
      });

      arena.innerHTML = `
        <div class="unit-tag-row">
          <span class="level-badge ${badgeClass}">${escapeHtml(q.level)}</span>
          <span class="unit-title-text">${escapeHtml(q.unit)}</span>
          <div style="display:flex; align-items:center; gap:8px;">
            <button class="icon-btn" style="width:24px; height:24px; font-size:0.85rem;" onclick="skipQuestion()" title="換一題/跳過">⏭️</button>
            <span style="font-size:0.8rem; font-weight:700; color:var(--text-muted);">${currentIndex + 1} / ${currentQuestions.length}</span>
          </div>
        </div>

        <div class="prompt-bubble">
          <div class="prompt-header">
            <span class="prompt-label">題目練習</span>
            <button class="speaker-btn" onclick="speakKorean('${escapeForJs(q.question)}')">🔊 聆聽發音</button>
          </div>
          <div class="question-dialogue">${formatQuestionText(q.question)}</div>
        </div>

        <div class="options-container">
          ${optionsHtml}
        </div>
      `;
    }

    function handleOptionSelect(selectedIdx) {
      if (answered) return;
      answered = true;

      const q = currentQuestions[currentIndex];
      const isCorrect = (selectedIdx === q.answer);
      const drawer = document.getElementById('feedback-drawer');
      const fbIcon = document.getElementById('fb-icon');
      const fbTitle = document.getElementById('fb-title');
      const fbAns = document.getElementById('fb-answer');
      const fbExpl = document.getElementById('fb-expl');

      // Haptic
      if (navigator.vibrate) {
        navigator.vibrate(isCorrect ? 25 : [40, 60, 40]);
      }

      // Button Visual Feedback
      q.options.forEach((_, idx) => {
        const btn = document.getElementById('opt-' + idx);
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add('correct-reveal');
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.add('wrong-reveal');
        }
      });

      // Update State
      userState.totalAnswered++;
      if (isCorrect) {
        userState.xp += 10;
        userState.streak++;
        if (userState.streak > userState.maxStreak) userState.maxStreak = userState.streak;
        userState.totalCorrect++;
        playSuccessChime();

        drawer.className = 'feedback-sheet correct open';
        fbIcon.textContent = '🎉';
        fbTitle.textContent = '대단해요! (答對了！)';
        fbAns.textContent = '獲取 +10 XP';
      } else {
        userState.streak = 0;
        if (userState.hearts > 1) userState.hearts--;
        if (!userState.mistakeIds.includes(q.id)) {
          userState.mistakeIds.push(q.id);
        }
        playWrongBuzzer();

        drawer.className = 'feedback-sheet wrong open';
        fbIcon.textContent = '💭';
        fbTitle.textContent = '아쉬워요! (再接再厲！)';
        fbAns.innerHTML = '正確答案是：<strong>' + (q.answer + 1) + '. ' + escapeHtml(q.options[q.answer]) + '</strong>';
      }

      fbExpl.innerHTML = `
        <div style="margin-bottom:6px;"><strong>文法解析：</strong>${escapeHtml(q.explanation)}</div>
        ${q.notes ? `<div style="padding:8px 12px; background:rgba(0,0,0,0.05); border-radius:8px; font-size:0.84rem; white-space:pre-line;"><strong>💡 考點規範：</strong>\n${escapeHtml(q.notes)}</div>` : ''}
      `;

      saveState();
    }

    function nextQuestion() {
      playPopSound();
      const drawer = document.getElementById('feedback-drawer');
      drawer.classList.remove('open');

      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderCurrentQuestion();
      } else {
        alert('恭喜你完成了當前組別的所有練習！🎉');
        shuffleCurrentQuestions();
      }
    }

    function shuffleCurrentQuestions(showToast = false) {
      playPopSound();
      shuffleArray(currentQuestions);
      currentIndex = 0;
      renderCurrentQuestion();
      if (showToast) {
        const drawer = document.getElementById('feedback-drawer');
        if (drawer) drawer.classList.remove('open');
        // Visual feedback
        if (navigator.vibrate) navigator.vibrate(15);
      }
    }

    function speakKorean(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.88;
        window.speechSynthesis.speak(utterance);
      }
    }

    // --- Tab Switching ---
    function switchMobileTab(tab, el) {
      playPopSound();
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      el.classList.add('active');

      document.getElementById('screen-practice').style.display = (tab === 'practice') ? 'flex' : 'none';
      document.getElementById('screen-reference').style.display = (tab === 'reference') ? 'block' : 'none';
      document.getElementById('screen-mistakes').style.display = (tab === 'mistakes') ? 'block' : 'none';
      document.getElementById('screen-stats').style.display = (tab === 'stats') ? 'block' : 'none';

      if (tab === 'reference') renderReferencesList(GRAMMAR_REFERENCES);
      if (tab === 'mistakes') renderMistakesList();
    }

    
    function renderReferencesList(refs) {
      const c = document.getElementById('ref-list-container');
      if (!refs || refs.length === 0) {
        c.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">找不到符合條件的文法速查卡</div>';
        return;
      }

      let html = '';
      refs.forEach(ref => {
        let badgeClass = 'badge-beg';
        if (ref.book === 'intermediate') badgeClass = 'badge-mid';
        if (ref.book === 'advanced') badgeClass = 'badge-adv';

        let tableHtml = '';
        if (ref.table) {
          let ths = ref.table.headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');
          let trs = ref.table.rows.map(r => `<tr>${r.map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('');
          tableHtml = `<div class="mobile-table-scroll"><table class="mobile-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
        }

        let lessonsTags = '';
        if (ref.lessons && ref.lessons.length > 0) {
          lessonsTags = `<div style="display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 10px;">` +
            ref.lessons.map(l => `<span style="font-size:0.75rem; background:#f1f5f9; color:#475569; padding:2px 8px; border-radius:6px; font-weight:600;">${escapeHtml(l)}</span>`).join('') +
            `</div>`;
        }

        html += `
          <div class="ref-card-mobile">
            <div class="ref-card-title">
              <span style="font-size:1rem;">${escapeHtml(ref.title)}</span>
              <span class="level-badge ${badgeClass}" style="font-size:0.75rem;">${escapeHtml(ref.chapter_num || ref.level)}</span>
            </div>
            ${lessonsTags}
            <p style="font-size:0.88rem; color:#475569; line-height:1.55; margin-bottom:8px;">${escapeHtml(ref.summary)}</p>
            ${tableHtml}
            ${ref.examples ? ref.examples.map(ex => `
              <div style="font-size:0.86rem; background:#f8fafc; padding:7px 10px; border-left:3px solid #6366f1; border-radius:4px; margin:5px 0; display:flex; justify-content:space-between; align-items:center;">
                <span>${escapeHtml(ex)}</span>
                <button class="speaker-btn" style="padding:2px 6px; font-size:0.75rem;" onclick="speakKorean('${escapeForJs(ex)}')">🔊</button>
              </div>
            `).join('') : ''}
            ${ref.nuance ? `<div style="font-size:0.84rem; background:#fef3c7; color:#92400e; padding:8px 12px; border-radius:8px; margin-top:10px; white-space:pre-line; line-height:1.5;"><strong>⚡ 考點與用法規範：</strong>
${escapeHtml(ref.nuance)}</div>` : ''}
          </div>
        `;
      });
      c.innerHTML = html;
    }

    function filterReferences() {
      const q = document.getElementById('ref-search').value.toLowerCase().trim();
      const filtered = GRAMMAR_REFERENCES.filter(r => {
        const matchBook = (currentRefBookFilter === 'all' || r.book === currentRefBookFilter);
        if (!matchBook) return false;
        if (!q) return true;
        const inTitle = r.title.toLowerCase().includes(q);
        const inSummary = r.summary.toLowerCase().includes(q);
        const inNuance = r.nuance && r.nuance.toLowerCase().includes(q);
        const inLessons = r.lessons && r.lessons.some(l => l.toLowerCase().includes(q));
        return inTitle || inSummary || inNuance || inLessons;
      });
      renderReferencesList(filtered);
    }


    function renderMistakesList() {
      const c = document.getElementById('mistakes-list-container');
      const mistakes = RAW_QUESTIONS.filter(q => userState.mistakeIds.includes(q.id));

      if (mistakes.length === 0) {
        c.innerHTML = `
          <div style="text-align:center; padding:60px 20px;">
            <div style="font-size:3rem; margin-bottom:12px;">🏆</div>
            <h3>目前沒有錯題記錄！</h3>
            <p style="color:var(--text-muted); font-size:0.9rem; margin-top:6px;">做錯的題目會自動記錄在此處，隨時進行專項強化複習。</p>
          </div>
        `;
        return;
      }

      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h3 style="font-size:1.1rem; font-weight:800;">錯題重點清單 (${mistakes.length} 題)</h3>
          <button class="chip-btn" style="padding:4px 10px; font-size:0.75rem;" onclick="clearAllMistakes()">清空記錄</button>
        </div>
      `;

      mistakes.forEach((q, idx) => {
        html += `
          <div class="ref-card-mobile" style="margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <span class="level-badge badge-beg">${escapeHtml(q.level)}</span>
              <button style="background:none; border:none; color:#ef4444; font-size:0.8rem; font-weight:700;" onclick="removeMistake('${q.id}')">已掌握 ✓</button>
            </div>
            <div style="font-size:0.95rem; font-weight:700; margin-bottom:6px; color:#1e293b;">${idx + 1}. ${escapeHtml(q.title)}</div>
            <div style="font-size:0.9rem; background:#f8fafc; padding:8px 12px; border-radius:8px; margin-bottom:8px; white-space:pre-line;">${formatQuestionText(q.question)}</div>
            <div style="font-size:0.88rem; color:#15803d; font-weight:700; margin-bottom:4px;">正確答案：${q.answer + 1}. ${escapeHtml(q.options[q.answer])}</div>
            <div style="font-size:0.85rem; color:#64748b;">${escapeHtml(q.explanation)}</div>
          </div>
        `;
      });

      c.innerHTML = html;
    }

    function removeMistake(id) {
      userState.mistakeIds = userState.mistakeIds.filter(m => m !== id);
      saveState();
      renderMistakesList();
    }

    function clearAllMistakes() {
      if (confirm('確定清空所有錯題？')) {
        userState.mistakeIds = [];
        saveState();
        renderMistakesList();
      }
    }

    function resetAllStats() {
      if (confirm('確定重置所有經驗值、連勝與記錄？')) {
        userState = { xp: 0, streak: 0, maxStreak: 0, hearts: 5, totalAnswered: 0, totalCorrect: 0, mistakeIds: [] };
        saveState();
        alert('記錄已全部重置！');
      }
    }

    function openChapterModal() {
      const units = [...new Set(RAW_QUESTIONS.map(q => q.unit))];
      const choice = prompt('請輸入要篩選的單元關鍵字（例如：추측, 이유, 조사, 1장），或留空顯示全部：');
      if (choice === null) return;
      if (choice.trim() === '') {
        currentQuestions = [...RAW_QUESTIONS];
      } else {
        currentQuestions = RAW_QUESTIONS.filter(q => q.unit.toLowerCase().includes(choice.trim().toLowerCase()));
      }
      if (currentQuestions.length === 0) {
        alert('找不到符合該關鍵字的單元，已還原全部題目。');
        currentQuestions = [...RAW_QUESTIONS];
      }
      currentIndex = 0;
      renderCurrentQuestion();
    }

    // --- Helpers ---
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeForJs(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/\\n/g, ' ');
    }

    function formatQuestionText(text) {
      return escapeHtml(text).replace(/\\n/g, '<br>');
    }

    // Init - Auto-Shuffle on launch so user never gets stuck seeing question #1 every time!
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      applyCombinedFilters(true); // Automatically randomizes questions upon launch!
    });
  </script>
</body>
</html>
