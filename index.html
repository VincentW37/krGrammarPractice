<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>Korean Grammar Master · 韓語文法互動學習</title>
  <style>
    :root {
      --primary: #58cc02; /* Duolingo vibrant green */
      --primary-dark: #46a302;
      --primary-shadow: #46a302;
      --indigo: #4f46e5;
      --indigo-shadow: #3730a3;
      --indigo-light: #eef2ff;
      --secondary: #1cb0f6;
      --secondary-shadow: #1899d6;
      --accent: #ff9600;
      --accent-shadow: #d88000;
      --danger: #ff4b4b;
      --danger-shadow: #ea2b2b;
      --danger-light: #fee2e2;
      --success-light: #dcfce7;
      --card-bg: #ffffff;
      --bg: #f7f9fa;
      --text: #3c3c3c;
      --text-muted: #777777;
      --border: #e5e5e5;
      --border-dark: #d4d4d4;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-pill: 999px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 60px);
      padding-bottom: calc(var(--safe-bottom) + 75px);
      overflow-x: hidden;
    }

    /* Top App Header (Duolingo / iOS style) */
    header.app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--safe-top) + 60px);
      padding-top: var(--safe-top);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
      z-index: 100;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: #f1f5f9;
      color: var(--text);
    }

    .stat-pill.streak { color: var(--accent); }
    .stat-pill.xp { color: #8b5cf6; }
    .stat-pill.hearts { color: var(--danger); }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.15s;
    }

    .icon-btn:active {
      background: #e2e8f0;
      transform: scale(0.92);
    }

    /* Progress Capsule Header Bar */
    .session-progress-bar {
      position: fixed;
      top: calc(var(--safe-top) + 60px);
      left: 0;
      right: 0;
      height: 12px;
      background: #e5e7eb;
      z-index: 95;
      padding: 2px 16px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #58cc02, #22c55e);
      border-radius: 6px;
      transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 6px;
      right: 6px;
      height: 3px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 3px;
    }

    /* Main Container */
    main.app-main {
      flex: 1;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Horizontal Chip Filter Bar */
    .chip-scroll-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .chip-scroll-container::-webkit-scrollbar { display: none; }

    .chip-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--border);
      background: white;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 0 var(--border);
      transition: all 0.15s ease;
    }

    .chip-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 transparent;
    }

    .chip-btn.active {
      border-color: var(--secondary);
      background: #f0f9ff;
      color: var(--secondary);
      box-shadow: 0 2px 0 var(--secondary-shadow);
    }

    /* Question Screen Layout */
    .question-screen {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .unit-tag-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .level-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .badge-beg { background: #e0f2fe; color: #0369a1; }
    .badge-mid { background: #dcfce7; color: #15803d; }
    .badge-adv { background: #fce7f3; color: #9d174d; }

    .unit-title-text {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    /* Prompt Box */
    .prompt-bubble {
      background: white;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 4px 0 var(--border);
      margin-bottom: 20px;
      position: relative;
    }

    .prompt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .prompt-label {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--indigo);
      text-transform: uppercase;
    }

    .speaker-btn {
      background: var(--indigo-light);
      border: none;
      color: var(--indigo);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .speaker-btn:active {
      transform: scale(0.95);
      background: #e0e7ff;
    }

    .question-dialogue {
      font-size: 1.18rem;
      font-weight: 600;
      line-height: 1.75;
      color: #1e293b;
      white-space: pre-line;
      user-select: text;
    }

    .blank-placeholder {
      display: inline-block;
      min-width: 70px;
      border-bottom: 3px dashed var(--indigo);
      color: var(--indigo);
      text-align: center;
      padding: 0 4px;
      font-weight: 800;
    }

    /* Duolingo Chunky 3D Option Buttons */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .chunky-option {
      width: 100%;
      min-height: 58px;
      padding: 14px 16px;
      background: white;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 0 var(--border-dark);
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .chunky-option:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border-dark);
    }

    .option-key {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .chunky-option.selected {
      border-color: #6366f1;
      background: var(--indigo-light);
      box-shadow: 0 4px 0 #4f46e5;
    }
    .chunky-option.selected .option-key {
      border-color: #6366f1;
      background: #6366f1;
      color: white;
    }

    .chunky-option.correct-reveal {
      border-color: #22c55e !important;
      background: #f0fdf4 !important;
      box-shadow: 0 4px 0 #16a34a !important;
      color: #15803d !important;
    }
    .chunky-option.correct-reveal .option-key {
      border-color: #16a34a;
      background: #16a34a;
      color: white;
    }

    .chunky-option.wrong-reveal {
      border-color: #ef4444 !important;
      background: #fef2f2 !important;
      box-shadow: 0 4px 0 #dc2626 !important;
      color: #b91c1c !important;
    }
    .chunky-option.wrong-reveal .option-key {
      border-color: #dc2626;
      background: #dc2626;
      color: white;
    }

    /* Duolingo Slide-Up Bottom Drawer */
    .feedback-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(var(--safe-bottom) + 20px);
      box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
      transform: translateY(110%);
      transition: transform 0.32s cubic-bezier(0.18, 0.89, 0.32, 1.18);
      z-index: 200;
      max-width: 600px;
      margin: 0 auto;
    }

    .feedback-sheet.open {
      transform: translateY(0);
    }

    .feedback-sheet.correct {
      background: var(--success-light);
      border-top: 2px solid #86efac;
    }

    .feedback-sheet.wrong {
      background: var(--danger-light);
      border-top: 2px solid #fca5a5;
    }

    .feedback-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .feedback-icon {
      font-size: 1.8rem;
    }

    .feedback-title {
      font-size: 1.3rem;
      font-weight: 800;
    }
    .feedback-sheet.correct .feedback-title { color: #15803d; }
    .feedback-sheet.wrong .feedback-title { color: #b91c1c; }

    .feedback-correct-answer {
      font-size: 1rem;
      font-weight: 700;
      color: #15803d;
      margin-bottom: 8px;
    }

    .feedback-explanation {
      font-size: 0.92rem;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 14px;
      max-height: 150px;
      overflow-y: auto;
    }

    .btn-continue {
      width: 100%;
      height: 54px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 1.1rem;
      font-weight: 800;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.1s;
    }

    .feedback-sheet.correct .btn-continue {
      background: var(--primary);
      box-shadow: 0 4px 0 var(--primary-shadow);
    }
    .feedback-sheet.correct .btn-continue:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--primary-shadow);
    }

    .feedback-sheet.wrong .btn-continue {
      background: var(--danger);
      box-shadow: 0 4px 0 var(--danger-shadow);
    }
    .feedback-sheet.wrong .btn-continue:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--danger-shadow);
    }

    /* iOS Native Fixed Bottom Tab Bar */
    nav.tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--safe-bottom) + 60px);
      padding-bottom: var(--safe-bottom);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 0;
      transition: color 0.15s;
    }

    .tab-item .tab-icon {
      font-size: 1.35rem;
    }

    .tab-item.active {
      color: #4f46e5;
    }

    /* Cheatsheet / Reference Screen on Mobile */
    .reference-screen {
      display: none;
    }

    .ref-search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border);
      background: white;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 16px;
      box-shadow: 0 2px 0 var(--border);
    }
    .ref-search-input:focus {
      border-color: var(--indigo);
    }

    .ref-card-mobile {
      background: white;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 0 var(--border);
    }

    .ref-card-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--indigo);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mobile-table-scroll {
      width: 100%;
      overflow-x: auto;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table.mobile-table {
      width: 100%;
      min-width: 320px;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    table.mobile-table th, table.mobile-table td {
      padding: 8px 10px;
      border: 1px solid var(--border);
      text-align: left;
    }
    table.mobile-table th { background: #f8fafc; font-weight: 700; }

    /* Mistakes Screen */
    .mistakes-screen {
      display: none;
    }

    /* Stats Screen */
    .stats-screen {
      display: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card-big {
      background: white;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      box-shadow: 0 3px 0 var(--border);
    }

    .stat-card-big .num {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--indigo);
      margin-bottom: 4px;
    }

    .stat-card-big .label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Top Fixed Header -->
  <header class="app-header">
    <div class="header-stats">
      <div class="stat-pill streak">🔥 <span id="streak-count">0</span></div>
      <div class="stat-pill xp">💎 <span id="xp-count">0</span></div>
      <div class="stat-pill hearts">❤️ <span id="hearts-count">5</span></div>
    </div>
    <div class="header-controls">
      <button class="icon-btn" id="sound-toggle-btn" onclick="toggleSound()" title="音效切換">🔊</button>
      <button class="icon-btn" onclick="openChapterModal()" title="章節篩選">☰</button>
    </div>
  </header>

  <!-- Session Progress Bar -->
  <div class="session-progress-bar">
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
  </div>

  <main class="app-main">
    <!-- View 1: Practice Arena -->
    <section id="screen-practice" class="question-screen">
      <!-- Horizontal Chip Filters -->
      <div class="chip-scroll-container">
        <button class="chip-btn active" onclick="setBookFilter('all', this)">🌟 全部</button>
        <button class="chip-btn" onclick="setBookFilter('beginner', this)">📘 初級</button>
        <button class="chip-btn" onclick="setBookFilter('intermediate', this)">📗 中級 (26章)</button>
        <button class="chip-btn" onclick="setBookFilter('advanced', this)">📕 高級 (22章)</button>
      </div>

      <!-- Question Card Body -->
      <div id="quiz-arena">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- View 2: Cheatsheet / Reference -->
    <section id="screen-reference" class="reference-screen">
      <input type="text" class="ref-search-input" id="ref-search" placeholder="🔍 搜尋文法辨析（如：통에, 텐데, 이/가）" oninput="filterReferences()">
      <div id="ref-list-container">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- View 3: Mistakes Screen -->
    <section id="screen-mistakes" class="mistakes-screen">
      <div id="mistakes-list-container">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- View 4: Stats Screen -->
    <section id="screen-stats" class="stats-screen">
      <div class="stats-grid">
        <div class="stat-card-big">
          <div class="num" id="stat-total-score">0</div>
          <div class="label">累計經驗 (XP)</div>
        </div>
        <div class="stat-card-big">
          <div class="num" id="stat-max-streak">0</div>
          <div class="label">最高連勝 (Streak)</div>
        </div>
        <div class="stat-card-big">
          <div class="num" id="stat-answered">0</div>
          <div class="label">已做題數</div>
        </div>
        <div class="stat-card-big">
          <div class="num" id="stat-accuracy">0%</div>
          <div class="label">總體正確率</div>
        </div>
      </div>

      <div class="prompt-bubble" style="text-align:center;">
        <h4 style="margin-bottom:8px;">💡 iPhone 溫習技巧</h4>
        <p style="font-size:0.9rem; color:var(--text-muted); line-height:1.6;">
          您可以點擊 Safari 底部的「分享 (Share)」按鈕，然後選擇<strong>「加入主畫面 (Add to Home Screen)」</strong>，即可像原生 App 一樣以全螢幕體驗溫習韓文！
        </p>
        <button class="btn-continue" style="background:#64748b; margin-top:14px; height:44px; font-size:0.92rem;" onclick="resetAllStats()">🔄 重置所有進度與記錄</button>
      </div>
    </section>
  </main>

  <!-- Duolingo Slide-up Bottom Drawer -->
  <div class="feedback-sheet" id="feedback-drawer">
    <div class="feedback-header-row">
      <div class="feedback-icon" id="fb-icon">✅</div>
      <div class="feedback-title" id="fb-title">대단해요! (做得好！)</div>
    </div>
    <div class="feedback-correct-answer" id="fb-answer"></div>
    <div class="feedback-explanation" id="fb-expl"></div>
    <button class="btn-continue" id="fb-continue-btn" onclick="nextQuestion()">繼續 (Continue) ➔</button>
  </div>

  <!-- iOS Fixed Bottom Navigation Tab Bar -->
  <nav class="tab-bar">
    <button class="tab-item active" onclick="switchMobileTab('practice', this)">
      <span class="tab-icon">🎯</span>
      <span>練習</span>
    </button>
    <button class="tab-item" onclick="switchMobileTab('reference', this)">
      <span class="tab-icon">📖</span>
      <span>速查</span>
    </button>
    <button class="tab-item" onclick="switchMobileTab('mistakes', this)">
      <span class="tab-icon">📌</span>
      <span>錯題本</span>
    </button>
    <button class="tab-item" onclick="switchMobileTab('stats', this)">
      <span class="tab-icon">📊</span>
      <span>成就</span>
    </button>
  </nav>

  <script>
    // --- Data Injected ---
    const RAW_QUESTIONS = [
  {
    "id": "beg_gr_01",
    "book": "beginner",
    "level": "初級 (Beginning)",
    "unit": "Getting Ready - 01 이다 / 아니다",
    "title": "이다 / 아니다 (是 / 不是)",
    "question": "가: 저 사람이 제이슨 씨예요?\n나: 아니요, 제이슨 씨가 ___________. 민우 씨예요.",
    "options": [
      "아니에요",
      "아닙니까",
      "이에요",
      "예요"
    ],
    "answer": 0,
    "explanation": "'이/가 아니다' 是 '이다' 的否定型。名詞 '제이슨 씨' 以母音結尾，因此接 '가 아니에요'（非敬語非格式體常用語）。",
    "notes": "• 名詞有收音 + 이 아니다\n• 名詞無收音 + 가 아니다\n• 是：名詞 + 이에요 (有收音) / 예요 (無收音)"
  },
  {
    "id": "beg_gr_02",
    "book": "beginner",
    "level": "初級 (Beginning)",

  },
  {
    "title": "【高級】假設讓步三部曲 (-더라도 vs -(으)ㄹ지라도 vs -(으)ㄴ들)",
    "level": "高級 (Advanced)",
    "summary": "高級第5章：假定前句退讓一步的情況下，探討語體莊重度與修辭反問效果。",
    "table": {
      "headers": [

      "rows": [

        ],
        [
          "-(으)ㄹ지라도",

        ],
        [

    },

    ],

];

    // --- Sound Synthesis (Web Audio API - Zero External Dependencies) ---
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playPopSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch(e) {}
    }

    function playSuccessChime() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 (Bright Major Chord)
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const startTime = ctx.currentTime + (idx * 0.07);
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.2, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.35);
        });
      } catch(e) {}
    }

    function playWrongBuzzer() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch(e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-toggle-btn');
      btn.textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled) playPopSound();
    }

    // --- State Management ---
    let currentBookFilter = 'all';
    let currentQuestions = [...RAW_QUESTIONS];
    let currentIndex = 0;
    let answered = false;

    let userState = {
      xp: 0,
      streak: 0,
      maxStreak: 0,
      hearts: 5,
      totalAnswered: 0,
      totalCorrect: 0,
      mistakeIds: []
    };

    function loadState() {
      try {
        const saved = localStorage.getItem('kg_mobile_state');
        if (saved) {
          userState = Object.assign(userState, JSON.parse(saved));
        }
      } catch(e) {}
      updateHeaderStats();
    }

    function saveState() {
      try {
        localStorage.setItem('kg_mobile_state', JSON.stringify(userState));
      } catch(e) {}
      updateHeaderStats();
    }

    function updateHeaderStats() {
      document.getElementById('streak-count').textContent = userState.streak;
      document.getElementById('xp-count').textContent = userState.xp;
      document.getElementById('hearts-count').textContent = userState.hearts;

      document.getElementById('stat-total-score').textContent = userState.xp;
      document.getElementById('stat-max-streak').textContent = userState.maxStreak;
      document.getElementById('stat-answered').textContent = userState.totalAnswered;
      const acc = userState.totalAnswered > 0 ? Math.round((userState.totalCorrect / userState.totalAnswered) * 100) : 0;
      document.getElementById('stat-accuracy').textContent = acc + '%';
    }

    function setBookFilter(book, btn) {
      playPopSound();
      currentBookFilter = book;
      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      currentQuestions = RAW_QUESTIONS.filter(q => {
        return book === 'all' || q.book === book;
      });

      if (currentQuestions.length === 0) {
        currentQuestions = [...RAW_QUESTIONS];
      }

      currentIndex = 0;
      renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
      const arena = document.getElementById('quiz-arena');
      const progressBar = document.getElementById('progress-bar');
      const drawer = document.getElementById('feedback-drawer');
      drawer.classList.remove('open');
      answered = false;

      if (currentQuestions.length === 0) {
        arena.innerHTML = '<div style="text-align:center; padding:40px;"><h3>沒有相應題目</h3></div>';
        return;
      }

      const q = currentQuestions[currentIndex];
      const progressPercent = ((currentIndex + 1) / currentQuestions.length) * 100;
      progressBar.style.width = progressPercent + '%';

      let badgeClass = 'badge-beg';
      if (q.book === 'intermediate') badgeClass = 'badge-mid';
      if (q.book === 'advanced') badgeClass = 'badge-adv';

      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        optionsHtml += `
          <button class="chunky-option" id="opt-${idx}" onclick="handleOptionSelect(${idx})">
            <div class="option-key">${idx + 1}</div>
            <div style="flex:1;">${escapeHtml(opt)}</div>
          </button>
        `;
      });

      arena.innerHTML = `
        <div class="unit-tag-row">
          <span class="level-badge ${badgeClass}">${escapeHtml(q.level)}</span>
          <span class="unit-title-text">${escapeHtml(q.unit)}</span>
          <span style="font-size:0.8rem; font-weight:700; color:var(--text-muted);">${currentIndex + 1} / ${currentQuestions.length}</span>
        </div>

        <div class="prompt-bubble">
          <div class="prompt-header">
            <span class="prompt-label">題目練習</span>
            <button class="speaker-btn" onclick="speakKorean('${escapeForJs(q.question)}')">🔊 聆聽發音</button>
          </div>
          <div class="question-dialogue">${formatQuestionText(q.question)}</div>
        </div>

        <div class="options-container">
          ${optionsHtml}
        </div>
      `;
    }

    function handleOptionSelect(selectedIdx) {
      if (answered) return;
      answered = true;

      const q = currentQuestions[currentIndex];
      const isCorrect = (selectedIdx === q.answer);
      const drawer = document.getElementById('feedback-drawer');
      const fbIcon = document.getElementById('fb-icon');
      const fbTitle = document.getElementById('fb-title');
      const fbAns = document.getElementById('fb-answer');
      const fbExpl = document.getElementById('fb-expl');

      // Haptic
      if (navigator.vibrate) {
        navigator.vibrate(isCorrect ? 25 : [40, 60, 40]);
      }

      // Button Visual Feedback
      q.options.forEach((_, idx) => {
        const btn = document.getElementById('opt-' + idx);
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add('correct-reveal');
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.add('wrong-reveal');
        }
      });

      // Update State
      userState.totalAnswered++;
      if (isCorrect) {
        userState.xp += 10;
        userState.streak++;
        if (userState.streak > userState.maxStreak) userState.maxStreak = userState.streak;
        userState.totalCorrect++;
        playSuccessChime();

        drawer.className = 'feedback-sheet correct open';
        fbIcon.textContent = '🎉';
        fbTitle.textContent = '대단해요! (答對了！)';
        fbAns.textContent = '獲取 +10 XP';
      } else {
        userState.streak = 0;
        if (userState.hearts > 1) userState.hearts--;
        if (!userState.mistakeIds.includes(q.id)) {
          userState.mistakeIds.push(q.id);
        }
        playWrongBuzzer();

        drawer.className = 'feedback-sheet wrong open';
        fbIcon.textContent = '💭';
        fbTitle.textContent = '아쉬워요! (再接再厲！)';
        fbAns.innerHTML = '正確答案是：<strong>' + (q.answer + 1) + '. ' + escapeHtml(q.options[q.answer]) + '</strong>';
      }

      fbExpl.innerHTML = `
        <div style="margin-bottom:6px;"><strong>文法解析：</strong>${escapeHtml(q.explanation)}</div>
        ${q.notes ? `<div style="padding:8px 12px; background:rgba(0,0,0,0.05); border-radius:8px; font-size:0.84rem; white-space:pre-line;"><strong>💡 考點規範：</strong>
${escapeHtml(q.notes)}</div>` : ''}
      `;

      saveState();
    }

    function nextQuestion() {
      playPopSound();
      const drawer = document.getElementById('feedback-drawer');
      drawer.classList.remove('open');

      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderCurrentQuestion();
      } else {
        alert('恭喜你完成了當前組別的所有練習！🎉');
        shuffleCurrentQuestions();
      }
    }

    function shuffleCurrentQuestions() {
      for (let i = currentQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
      }
      currentIndex = 0;
      renderCurrentQuestion();
    }

    function speakKorean(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.88;
        window.speechSynthesis.speak(utterance);
      }
    }

    // --- Tab Switching ---
    function switchMobileTab(tab, el) {
      playPopSound();
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      el.classList.add('active');

      document.getElementById('screen-practice').style.display = (tab === 'practice') ? 'flex' : 'none';
      document.getElementById('screen-reference').style.display = (tab === 'reference') ? 'block' : 'none';
      document.getElementById('screen-mistakes').style.display = (tab === 'mistakes') ? 'block' : 'none';
      document.getElementById('screen-stats').style.display = (tab === 'stats') ? 'block' : 'none';

      if (tab === 'reference') renderReferencesList(GRAMMAR_REFERENCES);
      if (tab === 'mistakes') renderMistakesList();
    }

    function renderReferencesList(refs) {
      const c = document.getElementById('ref-list-container');
      let html = '';
      refs.forEach(ref => {
        let tableHtml = '';
        if (ref.table) {
          let ths = ref.table.headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');
          let trs = ref.table.rows.map(r => `<tr>${r.map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('');
          tableHtml = `<div class="mobile-table-scroll"><table class="mobile-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
        }

        html += `
          <div class="ref-card-mobile">
            <div class="ref-card-title">
              <span>${escapeHtml(ref.title)}</span>
              <span class="level-badge badge-beg" style="font-size:0.75rem;">${escapeHtml(ref.level)}</span>
            </div>
            <p style="font-size:0.88rem; color:#475569; margin-bottom:8px;">${escapeHtml(ref.summary)}</p>
            ${tableHtml}
            ${ref.examples ? ref.examples.map(ex => `<div style="font-size:0.86rem; background:#f8fafc; padding:6px 10px; border-left:3px solid #6366f1; border-radius:4px; margin:4px 0;">${escapeHtml(ex)}</div>`).join('') : ''}
            ${ref.nuance ? `<div style="font-size:0.84rem; background:#fef3c7; color:#92400e; padding:8px 10px; border-radius:6px; margin-top:8px; white-space:pre-line;"><strong>⚡ 考點重點：</strong>
${escapeHtml(ref.nuance)}</div>` : ''}
          </div>
        `;
      });
      c.innerHTML = html;
    }

    function filterReferences() {
      const q = document.getElementById('ref-search').value.toLowerCase();
      const filtered = GRAMMAR_REFERENCES.filter(r => {
        return r.title.toLowerCase().includes(q) || r.summary.toLowerCase().includes(q) || (r.nuance && r.nuance.toLowerCase().includes(q));
      });
      renderReferencesList(filtered);
    }

    function renderMistakesList() {
      const c = document.getElementById('mistakes-list-container');
      const mistakes = RAW_QUESTIONS.filter(q => userState.mistakeIds.includes(q.id));

      if (mistakes.length === 0) {
        c.innerHTML = `
          <div style="text-align:center; padding:60px 20px;">
            <div style="font-size:3rem; margin-bottom:12px;">🏆</div>
            <h3>目前沒有錯題記錄！</h3>
            <p style="color:var(--text-muted); font-size:0.9rem; margin-top:6px;">做錯的題目會自動記錄在此處，隨時進行專項強化複習。</p>
          </div>
        `;
        return;
      }

      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h3 style="font-size:1.1rem; font-weight:800;">錯題重點清單 (${mistakes.length} 題)</h3>
          <button class="chip-btn" style="padding:4px 10px; font-size:0.75rem;" onclick="clearAllMistakes()">清空記錄</button>
        </div>
      `;

      mistakes.forEach((q, idx) => {
        html += `
          <div class="ref-card-mobile" style="margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <span class="level-badge badge-beg">${escapeHtml(q.level)}</span>
              <button style="background:none; border:none; color:#ef4444; font-size:0.8rem; font-weight:700;" onclick="removeMistake('${q.id}')">已掌握 ✓</button>
            </div>
            <div style="font-size:0.95rem; font-weight:700; margin-bottom:6px; color:#1e293b;">${idx + 1}. ${escapeHtml(q.title)}</div>
            <div style="font-size:0.9rem; background:#f8fafc; padding:8px 12px; border-radius:8px; margin-bottom:8px; white-space:pre-line;">${formatQuestionText(q.question)}</div>
            <div style="font-size:0.88rem; color:#15803d; font-weight:700; margin-bottom:4px;">正確答案：${q.answer + 1}. ${escapeHtml(q.options[q.answer])}</div>
            <div style="font-size:0.85rem; color:#64748b;">${escapeHtml(q.explanation)}</div>
          </div>
        `;
      });

      c.innerHTML = html;
    }

    function removeMistake(id) {
      userState.mistakeIds = userState.mistakeIds.filter(m => m !== id);
      saveState();
      renderMistakesList();
    }

    function clearAllMistakes() {
      if (confirm('確定清空所有錯題？')) {
        userState.mistakeIds = [];
        saveState();
        renderMistakesList();
      }
    }

    function resetAllStats() {
      if (confirm('確定重置所有經驗值、連勝與記錄？')) {
        userState = { xp: 0, streak: 0, maxStreak: 0, hearts: 5, totalAnswered: 0, totalCorrect: 0, mistakeIds: [] };
        saveState();
        alert('記錄已全部重置！');
      }
    }

    function openChapterModal() {
      const units = [...new Set(RAW_QUESTIONS.map(q => q.unit))];
      const choice = prompt('請輸入要篩選的單元關鍵字（例如：추측, 이유, 조사, 1장），或留空顯示全部：');
      if (choice === null) return;
      if (choice.trim() === '') {
        currentQuestions = [...RAW_QUESTIONS];
      } else {
        currentQuestions = RAW_QUESTIONS.filter(q => q.unit.toLowerCase().includes(choice.trim().toLowerCase()));
      }
      if (currentQuestions.length === 0) {
        alert('找不到符合該關鍵字的單元，已還原全部題目。');
        currentQuestions = [...RAW_QUESTIONS];
      }
      currentIndex = 0;
      renderCurrentQuestion();
    }

    // --- Helpers ---
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeForJs(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\'").replace(/\n/g, ' ');
    }

    function formatQuestionText(text) {
      return escapeHtml(text).replace(/\n/g, '<br>');
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderCurrentQuestion();
    });
  </script>
