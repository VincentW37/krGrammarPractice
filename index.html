<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korean Grammar Interactive Master · 韓語文法互動學習系統</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --secondary: #0ea5e9;
      --secondary-light: #f0f9ff;
      --accent: #f59e0b;
      --success: #10b981;
      --success-light: #ecfdf5;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 4px 12px -2px rgba(0,0,0,0.06), 0 2px 6px -1px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.08), 0 4px 10px -2px rgba(0,0,0,0.04);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }


    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
    }


    header {
      background: linear-gradient(135deg, #312e81 0%, #4338ca 50%, #4f46e5 100%);
      color: white;
      padding: 30px 20px 24px;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.2);
    }


    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }


    .header-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }


    .app-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }


    .app-subtitle {
      font-size: 0.95rem;
      opacity: 0.85;
      font-weight: 400;
    }


    .top-stats {
      display: flex;
      gap: 12px;
    }


    .stat-badge {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }


    /* Navigation Bar */
    nav.nav-tabs {
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.18);
      padding: 6px;
      border-radius: 12px;
      margin-top: 6px;
      overflow-x: auto;
    }


    .nav-tab-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.8);
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }


    .nav-tab-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.1);
    }


    .nav-tab-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }


    /* Main Container */
    main {
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 16px;
    }


    /* Filter Controls */
    .filter-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }


    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }


    .filter-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }


    select, button.action-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }


    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }


    .action-btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      font-weight: 600;
    }


    .action-btn.primary:hover {
      background: var(--primary-hover);
    }


    /* Quiz Card */
    .quiz-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      position: relative;
      margin-bottom: 24px;
    }


    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }


    .badge-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }


    .badge-beginner {
      background: #dbeafe;
      color: #1e40af;
    }


    .badge-advanced {
      background: #fce7f3;
      color: #9d174d;
    }


    .badge-unit {
      background: #f1f5f9;
      color: #475569;
    }


    .q-progress {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }


    .question-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }


    .question-body {
      background: var(--bg);
      border-left: 4px solid var(--primary);
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
      font-size: 1.1rem;
      margin-bottom: 24px;
      white-space: pre-line;
      line-height: 1.7;
    }


    .tts-btn {
      background: rgba(79, 70, 229, 0.1);
      border: none;
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 8px;
      vertical-align: middle;
    }


    .tts-btn:hover {
      background: rgba(79, 70, 229, 0.2);
    }


    /* Options List */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }


    @media (min-width: 640px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }


    .option-btn {
      text-align: left;
      padding: 14px 18px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: white;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }


    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }


    .option-btn.selected-correct {
      border-color: var(--success);
      background: var(--success-light);
      color: #065f46;
      font-weight: 700;
    }


    .option-btn.selected-wrong {
      border-color: var(--danger);
      background: var(--danger-light);
      color: #991b1b;
      font-weight: 700;
    }


    .option-btn.reveal-correct {
      border-color: var(--success);
      background: #f0fdf4;
      border-style: dashed;
    }


    /* Explanation Panel */
    .explanation-panel {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      animation: fadeIn 0.3s ease;
    }


    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }


    .explanation-header {
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }


    .explanation-header.correct {
      color: #059669;
    }


    .explanation-header.wrong {
      color: #dc2626;
    }


    .explanation-text {
      font-size: 0.95rem;
      color: #334155;
      margin-bottom: 12px;
      white-space: pre-line;
    }


    .grammar-note-box {
      background: white;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.88rem;
      color: #475569;
      white-space: pre-line;
    }


    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }


    /* Reference & Cheatsheet Styles */
    .reference-section {
      display: none;
    }


    .ref-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }


    @media (min-width: 768px) {
      .ref-grid {
        grid-template-columns: 1fr 1fr;
      }
    }


    .ref-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }


    .ref-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }


    .ref-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }


    .ref-content {
      font-size: 0.92rem;
      color: #334155;
      line-height: 1.6;
    }


    .ref-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 0.88rem;
    }


    .ref-table th, .ref-table td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
    }


    .ref-table th {
      background: #f1f5f9;
      font-weight: 600;
      color: var(--text);
    }


    .example-tag {
      background: #f8fafc;
      border-left: 3px solid #6366f1;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      font-size: 0.88rem;
      margin: 4px 0;
    }


    /* Mistake Review Section */
    .mistakes-section {
      display: none;
    }


    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }


    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }


    /* Progress bar */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 20px;
    }


    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>


  <header>
    <div class="header-inner">
      <div class="header-title-row">
        <div>
          <h1 class="app-title">🇰🇷 Korean Grammar Interactive Master</h1>
          <p class="app-subtitle">《Korean Grammar in Use》初級 / 高級互動練習與文法辨析系統</p>
        </div>
        <div class="top-stats">
          <div class="stat-badge" title="連續答對次數">🔥 連勝: <span id="streak-count">0</span></div>
          <div class="stat-badge" title="累計得分">⭐ 分數: <span id="score-count">0</span></div>
          <div class="stat-badge" title="完成率">📈 正確率: <span id="accuracy-rate">0%</span></div>
        </div>
      </div>


      <nav class="nav-tabs">
        <button class="nav-tab-btn active" onclick="switchView('practice')">✍️ 互動練習 (Practice)</button>
        <button class="nav-tab-btn" onclick="switchView('reference')">📖 文法辨析與要點速查 (Cheatsheet)</button>
        <button class="nav-tab-btn" onclick="switchView('mistakes')">📌 錯題本與重點複習 (Mistakes Review)</button>
      </nav>
    </div>
  </header>


  <main>
    <!-- Filter Bar (visible in practice mode) -->
    <div class="filter-card" id="practice-filters">
      <div class="filter-group">
        <span class="filter-label">教材範圍:</span>
        <select id="book-select" onchange="onFilterChange()">
          <option value="all">🌟 全部教材 (初級 + 高級)</option>
          <option value="beginner">📘 初級 (Beginning to Early Intermediate)</option>
          <option value="advanced">📕 高級 (Advanced)</option>
        </select>
      </div>


      <div class="filter-group">
        <span class="filter-label">章節類別:</span>
        <select id="unit-select" onchange="onFilterChange()">
          <option value="all">所有章節類別</option>
        </select>
      </div>


      <div class="filter-group">
        <button class="action-btn" onclick="shuffleCurrentQuestions()">🔀 隨機洗牌</button>
        <button class="action-btn" onclick="resetProgress()">🔄 重置記錄</button>
      </div>
    </div>


    <!-- Practice View -->
    <section id="view-practice">
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>


      <div class="quiz-card" id="quiz-container">
        <!-- Content will be rendered dynamically -->
      </div>
    </section>


    <!-- Grammar Reference / Cheatsheet View -->
    <section id="view-reference" class="reference-section">
      <div class="ref-grid" id="ref-container">
        <!-- Reference cards will be rendered dynamically -->
      </div>
    </section>


    <!-- Mistakes View -->
    <section id="view-mistakes" class="mistakes-section">
      <div id="mistakes-container">
        <!-- Mistakes will be rendered dynamically -->
      </div>
    </section>
  </main>


  <script>
    // --- Data Definitions ---
    const RAW_QUESTIONS = [
  {
    "id": "beg_gr_01",
    "book": "beginner",
    "level": "初級 (Beginning)",
    "unit": "Getting Ready - 01 이다 / 아니다",
    "title": "이다 / 아니다 (是 / 不是)",
    "question": "가: 저 사람이 제이슨 씨예요?\n나: 아니요, 제이슨 씨가 ___________. 민우 씨예요.",
    "options": [
      "아니에요",
      "아닙니까",
      "이에요",
      "예요"
    ],
    "answer": 0,
    "explanation": "'이/가 아니다' 是 '이다' 的否定型。名詞 '제이슨 씨' 以母音結尾，因此接 '가 아니에요'（非敬語非格式體常用語）。",
    "notes": "• 名詞有收音 + 이 아니다\n• 名詞無收音 + 가 아니다\n• 是：名詞 + 이에요 (有收音) / 예요 (無收音)"
  },
  {
    "id": "beg_gr_02",
    "book": "beginner",
    "level": "初級 (Beginning)",
    "unit": "Getting Ready - 02 있다 / 없다 & 方位",
    "title": "있다 / 없다 (存在、位置與擁有)",
    "question": "가: 지갑이 어디에 있어요?\n나: 책상 서랍 _________ 있어요.",
    "options": [
      "안에",
      "밖에",
      "위에",
      "사이에"
    ],
    "answer": 0,
    "explanation": "書桌抽屜的「裡面」應用 '안에' (책상 서랍 안에 있어요)。'밖' 是外面，'위' 是上面，'사이' 是兩者之間。",
    "notes": "• 位置詞：위(上), 아래/밑(下), 앞(前), 뒤(後), 안(內), 밖(外), 옆(旁), 사이(間)"
  },
  {
    "id": "beg_gr_03",
    "book": "beginner",
    "level": "初級 (Beginning)",
    "unit": "Getting Ready - 03 數字與單位量詞",
    "title": "固有詞數字與量詞縮形",
    "question": "가: 커피숍에서 무엇을 주문했어요?\n나: 아이스 아메리카노 _________ 잔하고 도넛 _________ 개 샀어요.",
    "options": [
      "두 / 네",
      "둘 / 넷",
      "이 / 사",
      "두 / 사"
    ],
    "answer": 0,
    "explanation": "固有詞數字 1(하나), 2(둘), 3(셋), 4(넷), 20(스물) 接量詞時，必須變為 한, 두, 세, 네, 스무。量詞 '잔'(杯)、'개'(個) 前需使用 '두 잔', '네 개'。",
    "notes": "• 固有詞數量詞：한 명, 두 잔, 세 개, 네 마리, 스무 살\n• 漢字詞：年、月、日、分、電話號碼、價格"
  },
  {
    "id": "beg_gr_04",
    "book": "beginner",
    "level": "初級 (Beginning)",
    "unit": "Getting Ready - 04/05 時間與日期",
    "title": "時間的韓語表達法",
    "question": "현재 시각이 \"08:45 AM\"일 때, 알맞은 한국어 표현은?",
    "options": [
      "오전 여덟 시 사십오 분 (오전 아홉 시 십오 분 전)",
      "오후 팔 시 사십오 분",
      "오전 팔 시 사십오 분",
      "오후 여덟 시 마흔다섯 분"
    ],
    "answer": 0,
    "explanation": "韓語中「時(시)」用固有詞（여덟 시），「分(분)」用漢字詞（사십오 분）。8點45分亦常表達成「9點差15分」(아홉 시 십오 분 전)。",
    "notes": "• 時 = 固有詞 (한, 두, 세, 네, 다섯, 여섯, 일곱, 여덟, 아홉, 열, 열한, 열두)\n• 分 = 漢字詞 (십, 이십, 삼십, 사십, 오십...)"
  },
  {
    "id": "beg_u1_01",
    "book": "beginner",
    "level": "初級 (Beginning)",
    "unit": "Unit 1. Tenses - 01/02 現在式",
    "title": "現在式：-아/어요 母音縮合規則",
    "question": "다음 중 동사/형용사의 현재형(-아/어요) 불규칙/축약이 잘못된 것은?",
    "options": [
      "배우다 → 배워요",
      "마시다 → 마셔요",
      "만들다 → 만들어요",
      "가르치다 → 가르치어요"
    ],
    "answer": 3,
    "explanation": "'가르치다' 詞幹以 'ㅣ' 結尾，與 '-어요' 結合時應縮合為 '가르쳐요'，而不是保持 '가르치어요'。",
    "notes": "• ㅏ, ㅗ 結尾 → -아요 (보다 → 봐요, 가다 → 가요)\n• 其他母音結尾 → -어요 (배우다 → 배워요, 마시다 → 마셔요, 가르치다 → 가르쳐요)\n• 하다 → 해요"
  },
  {
    "id": "beg_u1_02",
    "book": "beginner",
    "level": "初級 (Beginning)",
    "unit": "Unit 1. Tenses - 03/06 過去式與過去完成式",
    "title": "-았/었어요 vs -았/었었어요 語氣差異",
    "question": "가: 수진 씨는 지금 한국에 살아요?\n나: 아니요, 작년까지 한국에 ___________. 지금은 미국으로 돌아갔어요.",
    "options": [
      "살았었어요",
      "살아요",
      "살고 있어요",
      "살 거예요"
    ],
    "answer": 0,
    "explanation": "'-았/었었어요' 表示過去曾經存在或發生某狀態，但該狀態在現在已經改變或中斷（斷絕）。對話明確指出「現在已經回美國了」，因此用 '살았었어요' 最恰當。",
    "notes": "• -았/었어요: 過去某時發生的單純事實，該狀態目前可能仍在持續。\n• -았/었었어요: 過去曾如此，但現在已經不再是那種狀態（與現在對比/已中斷）。"
  },

    // --- State Management ---
    let currentQuestions = [...RAW_QUESTIONS];

      score: 0,
      streak: 0,

    // Load stats from LocalStorage
    function loadStorage() {
      try {
        const saved = localStorage.getItem('kg_stats');
        if (saved) {
          stats = Object.assign(stats, JSON.parse(saved));
          updateStatsDisplay();
        }
      } catch (e) {
        console.warn('Storage load failed', e);
      }
    }


    function saveStorage() {
      try {
        localStorage.setItem('kg_stats', JSON.stringify(stats));
      } catch (e) {
        console.warn('Storage save failed', e);
      }
    }


    function updateStatsDisplay() {
      document.getElementById('score-count').textContent = stats.score;
      document.getElementById('streak-count').textContent = stats.streak;
      const acc = stats.totalAnswered > 0 ? Math.round((stats.totalCorrect / stats.totalAnswered) * 100) : 0;
      document.getElementById('accuracy-rate').textContent = acc + '%';
    }


    function populateUnitSelect() {
      const bookFilter = document.getElementById('book-select').value;
      const unitSelect = document.getElementById('unit-select');
      const units = new Set();
      RAW_QUESTIONS.forEach(q => {
        if (bookFilter === 'all' || q.book === bookFilter) {
          units.add(q.unit);
        }
      });
      unitSelect.innerHTML = '<option value="all">所有章節類別 (' + units.size + ' 個)</option>';
      units.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u;
        opt.textContent = u;
        unitSelect.appendChild(opt);
      });
    }


    function onFilterChange() {
      const bookFilter = document.getElementById('book-select').value;
      const unitFilter = document.getElementById('unit-select').value;


      currentQuestions = RAW_QUESTIONS.filter(q => {
        const matchBook = (bookFilter === 'all' || q.book === bookFilter);
        const matchUnit = (unitFilter === 'all' || q.unit === unitFilter);
        return matchBook && matchUnit;
      });


      if (currentQuestions.length === 0) {
        currentQuestions = [...RAW_QUESTIONS];
      }


      currentIndex = 0;
      renderCurrentQuestion();
    }


    function shuffleCurrentQuestions() {
      for (let i = currentQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
      }
      currentIndex = 0;
      renderCurrentQuestion();
    }


    function resetProgress() {
      if (confirm('確定重置所有練習進度與錯題記錄嗎？')) {
        stats = { score: 0, streak: 0, totalAnswered: 0, totalCorrect: 0, mistakeIds: [] };
        saveStorage();
        updateStatsDisplay();
        currentIndex = 0;
        renderCurrentQuestion();
        renderMistakes();
      }
    }


    // TTS pronunciation using SpeechSynthesis
    function speakKorean(text) {
      if ('speechSynthesis' in window) {
        // Extract Korean text only for cleaner pronunciation
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      } else {
        alert('您的瀏覽器不支援語音合成功能。');
      }
    }


    // Render Question
    function renderCurrentQuestion() {
      const container = document.getElementById('quiz-container');
      const progressBar = document.getElementById('progress-bar');
      
      if (currentQuestions.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>目前篩選條件下沒有題目</h3></div>';
        return;
      }


      const q = currentQuestions[currentIndex];
      const progressPercent = ((currentIndex + 1) / currentQuestions.length) * 100;
      progressBar.style.width = progressPercent + '%';
      answered = false;


      const isBookBeg = q.book === 'beginner';
      const levelBadgeClass = isBookBeg ? 'badge-beginner' : 'badge-advanced';


      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        optionsHtml += `
          <button class="option-btn" id="opt-btn-${idx}" onclick="handleSelectOption(${idx})">
            <span><strong>${idx + 1}.</strong> ${escapeHtml(opt)}</span>
          </button>
        `;
      });


      container.innerHTML = `
        <div class="card-meta">
          <div>
            <span class="badge-pill ${levelBadgeClass}">${escapeHtml(q.level)}</span>
            <span class="badge-pill badge-unit">${escapeHtml(q.unit)}</span>
          </div>
          <div class="q-progress">題目 ${currentIndex + 1} / ${currentQuestions.length}</div>
        </div>


        <h3 class="question-title">
          ${escapeHtml(q.title)}
          <button class="tts-btn" onclick="speakKorean('${escapeForJs(q.question)}')">🔊 發音</button>
        </h3>


        <div class="question-body">${formatQuestionText(q.question)}</div>


        <div class="options-grid">
          ${optionsHtml}
        </div>


        <div class="explanation-panel" id="exp-panel">
          <div class="explanation-header" id="exp-header"></div>
          <div class="explanation-text" id="exp-text"></div>
          ${q.notes ? `<div class="grammar-note-box"><strong>💡 文法規則 & 易混淆點：</strong>\n${escapeHtml(q.notes)}</div>` : ''}
        </div>


        <div class="quiz-footer">
          <button class="action-btn" onclick="bookmarkMistake('${q.id}')">🔖 收藏/加入錯題本</button>
          <button class="action-btn primary" id="next-q-btn" onclick="nextQuestion()" style="display:none;">下一題 ➔</button>
        </div>
      `;
    }


    function handleSelectOption(selectedIdx) {
      if (answered) return;
      answered = true;


      const q = currentQuestions[currentIndex];
      const isCorrect = (selectedIdx === q.answer);
      const expPanel = document.getElementById('exp-panel');
      const expHeader = document.getElementById('exp-header');
      const expText = document.getElementById('exp-text');
      const nextBtn = document.getElementById('next-q-btn');


      // Update button styles
      q.options.forEach((opt, idx) => {
        const btn = document.getElementById('opt-btn-' + idx);
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add(isCorrect ? 'selected-correct' : 'reveal-correct');
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.add('selected-wrong');
        }
      });


      // Update Stats
      stats.totalAnswered++;
      if (isCorrect) {
        stats.score += 10;
        stats.streak++;
        stats.totalCorrect++;
        expHeader.className = 'explanation-header correct';
        expHeader.innerHTML = '✅ 回答正確！ (+10 分)';
      } else {
        stats.streak = 0;
        expHeader.className = 'explanation-header wrong';
        expHeader.innerHTML = '❌ 回答錯誤！ 正確答案是：<strong>' + (q.answer + 1) + '. ' + escapeHtml(q.options[q.answer]) + '</strong>';
        if (!stats.mistakeIds.includes(q.id)) {
          stats.mistakeIds.push(q.id);
        }
      }


      expText.textContent = q.explanation;
      expPanel.style.display = 'block';
      nextBtn.style.display = 'inline-block';


      saveStorage();
      updateStatsDisplay();
    }


    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
      } else {
        alert('恭喜你完成了本組別的所有題目！點擊「確定」重新洗牌練習。');
        shuffleCurrentQuestions();
      }
      renderCurrentQuestion();
    }


    function bookmarkMistake(id) {
      if (!stats.mistakeIds.includes(id)) {
        stats.mistakeIds.push(id);
        alert('已將此題加入錯題重點庫！');
      } else {
        alert('此題已經在錯題庫中。');
      }
      saveStorage();
    }


    // Tab Switching
    function switchView(view) {
      document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));

      if (view === 'practice') buttons[0].classList.add('active');
      if (view === 'reference') buttons[1].classList.add('active');
      if (view === 'mistakes') buttons[2].classList.add('active');


      document.getElementById('view-practice').style.display = (view === 'practice') ? 'block' : 'none';
      document.getElementById('practice-filters').style.display = (view === 'practice') ? 'flex' : 'none';
      document.getElementById('view-reference').style.display = (view === 'reference') ? 'block' : 'none';

      if (view === 'mistakes') renderMistakes();

          </div>
        `;
      });
      container.innerHTML = html;

    function renderRefTable(table) {
      let ths = table.headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');
      let trs = table.rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('');
      return `<table class="ref-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
    }

    function clearMistakes() {
      if (confirm('確定清空所有錯題記錄嗎？')) {
        stats.mistakeIds = [];
        saveStorage();
        renderMistakes();
      }
    }


    function removeSingleMistake(id) {
      stats.mistakeIds = stats.mistakeIds.filter(mid => mid !== id);
      saveStorage();
      renderMistakes();
    }


    // Helper utilities
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }


    function escapeForJs(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/\\n/g, ' ');
    }


    function formatQuestionText(text) {
      return escapeHtml(text).replace(/\\n/g, '<br>');
    }


    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      populateUnitSelect();
      renderCurrentQuestion();
    });
  </script>
</body>
</html>
