<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>韓文文法通 (Korean Grammar Master)</title>
  <style>
    /* iOS 安全區域適配與 Duolingo 式 3D 按鈕樣式 */
    :root {
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
      --primary: #58cc02;
      --primary-border: #46a302;
      --wrong: #ff4b4b;
      --wrong-border: #d32f2f;
      --bg: #f7f9fa;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #4b5563;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 65px);
    }
    /* 3D 按鈕手感 */
    .btn-3d {
      border: 2px solid #e5e7eb;
      border-bottom: 5px solid #d1d5db;
      background: #fff;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      padding: 16px;
      cursor: pointer;
      transition: all 0.08s ease-in-out;
      text-align: left;
    }
    .btn-3d:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }
    /* Cheatsheet 搜尋框與卡片 */
    .cs-search {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #d1d5db;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .cs-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .cs-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .badge-beg { background: #e0f2fe; color: #0284c7; }
    .badge-int { background: #dcfce7; color: #16a34a; }
    .badge-adv { background: #ffe4e6; color: #e11d48; }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 頂部計量與發音設定 -->
    <header id="top-bar"></header>

    <!-- 主學習區 (隨機練習題) -->
    <main id="quiz-view"></main>

    <!-- Cheatsheet 溫習卡區 (全73課全收錄) -->
    <section id="cheatsheet-view" style="display:none; padding: 16px;">
      <input type="text" id="cs-search-input" class="cs-search" placeholder="🔍 搜尋文法 (如: 탓에, 느라고, 모양이다)..." oninput="filterCheatsheet()">
      <div id="cs-container"></div>
    </section>

    <!-- 底部滑出解析抽屜 -->
    <div id="bottom-drawer"></div>

    <!-- 底部 Tab 導航列 -->
    <nav id="tab-nav"></nav>
  </div>

  <script>
    // Fisher-Yates 隨機洗牌演算法
    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // 每次載入或篩選時調用
    function loadAndShuffleQuestions(level = 'all', type = 'all') {
      let filtered = ALL_QUESTIONS_600;
      if (level !== 'all') filtered = filtered.filter(q => q.level === level);
      if (type !== 'all') filtered = filtered.filter(q => q.type === type);
      
      // 題目隨機洗牌
      currentQuestions = shuffleArray(filtered);
      currentIndex = 0;
      renderCurrentQuestion();
    }

    // 渲染題目時，對選項進行隨機打散
    function renderCurrentQuestion() {
      const q = currentQuestions[currentIndex];
      // 隨機排列選項，但保留正確答案判斷
      const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
      const shuffledOptions = shuffleArray(optionsWithIndex);
      // 渲染題面與按鈕...
    }
  </script>
</body>
</html>
